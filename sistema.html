<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAR Engenharia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:#f5f6f8;
    overflow:hidden;
    visibility:hidden;
}

/* ==========================
   TOPO
========================== */

.topbar{
    height:76px;
    background:linear-gradient(110deg,#001c13 0%,#003321 68%,#002719 100%);
    border-bottom:2px solid #80db15;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.top-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
}

.print-wrapper{
    position:relative;
    display:flex;
    align-items:center;
}

.top-print-btn{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:6px;
    background:transparent;

    font-size:18px;
    line-height:1;
    cursor:pointer;
    transition:.2s;
}

.top-print-btn:hover{
    background:#f0f3f3;
}

.print-tooltip{
    position:absolute;
    top:40px;
    right:0;

    padding:6px 9px;
    border-radius:5px;

    background:#444;
    color:#fff;

    font-size:11px;
    white-space:nowrap;

    opacity:0;
    visibility:hidden;
    transform:translateY(-3px);
    transition:.2s;

    z-index:1000;
    pointer-events:none;
}

.print-tooltip::before{
    content:"";
    position:absolute;
    top:-5px;
    right:11px;

    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-bottom:5px solid #444;
}

.print-wrapper:hover .print-tooltip{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.toggle-left{
    cursor:pointer;
    font-size:22px;
    color:#fff;
    user-select:none;
}

/* Identidade SAR: texto vetorial, sem cortes nem imagem achatada */
.logo{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:3px;
    min-width:0;
    padding-left:15px;
    border-left:1px solid rgba(255,255,255,.55);
    color:#fff;
}
.logo-name{
    font-size:clamp(21px, 2.1vw, 30px);
    font-weight:750;
    letter-spacing:-.6px;
    line-height:1.06;
    white-space:nowrap;
}
.logo-tagline{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:clamp(9px, .9vw, 12px);
    font-weight:500;
    letter-spacing:1.45px;
    line-height:1.25;
    white-space:nowrap;
}
.logo-tagline::before,
.logo-tagline::after{
    content:"";
    display:block;
    width:18px;
    height:2px;
    flex:none;
    background:#8fe000;
}
@media (max-width:560px){
    .topbar{padding:0 12px;}
    .top-left{gap:10px;}
    .logo{padding-left:10px;}
    .logo-name{font-size:clamp(16px,4.4vw,23px);}
    .logo-tagline{font-size:clamp(7px,1.65vw,10px);letter-spacing:.4px;gap:4px;}
    .logo-tagline::before,.logo-tagline::after{width:8px;}
}
.topbar .top-print-btn{
    color:#fff;
}
.topbar .top-print-btn:hover{
    background:rgba(255,255,255,.12);
} 

/* ==========================
   LAYOUT
========================== */

.container{
    display:flex;
    height:calc(100vh - 76px);
}

/* ==========================
   MENU ESQUERDO
========================== */

.sidebar{
width:260px;
min-width:260px;
flex-shrink:0;
background:#fff;
border-right:1px solid #ddd;
transition:.3s;
display:flex;
flex-direction:column;
overflow:hidden;

}
/* Área dos módulos: somente esta parte terá rolagem */
#menuDinamico{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
}
/* ==========================
RODAPÉ DO MENU ESQUERDO
========================== */
.sidebar-footer{
flex-shrink:0;
padding:10px 8px 12px;
border-top:1px solid #e5e5e5;
background:#fff;
text-align:center;
}
.sidebar-footer-icons{
display:flex;
justify-content:center;
align-items:center;
gap:16px;
margin-bottom:9px;
}
.sidebar-footer-btn{
width:28px;
height:28px;
display:flex;
align-items:center;
justify-content:center;
border:none;
border-radius:5px;
background:transparent;

font-size:16px;
line-height:1;
cursor:pointer;
transition:.2s;

}
.sidebar-footer-btn:hover{
background:#f0f3f3;
transform:translateY(-1px);
}
.sidebar-footer-btn:active{
transform:translateY(0);
}
.sidebar-footer-btn.logout:hover{
    background:#fff0f0;
}

.sidebar-footer-brand{
    color:#555;
    line-height:1.35;
}
.sidebar-footer-brand strong{
display:block;
color:#315858;
font-size:13px;
margin-bottom:1px;
}
.sidebar-footer-brand span{
display:block;
font-size:10px;
}
.sidebar-footer-version{
margin-top:3px;
color:#888;
font-size:10px;
}
/* Menu recolhido */
.sidebar.collapsed .sidebar-footer{
padding:8px 4px;
}
.sidebar.collapsed .sidebar-footer-icons{
display:grid;
grid-template-columns:repeat(2, 28px);
justify-content:center;
gap:5px;
margin-bottom:0;
}
.sidebar.collapsed .sidebar-footer-brand{
display:none;
}

.sidebar.collapsed{
width:65px;
min-width:65px;
} 

.portal-title{
    background:#444;
    color:white;
    text-align:center;
    padding:14px;
    font-weight:600;
}

.sidebar.collapsed .portal-title{
    display:none;
}

.menu-item{
    padding:14px 18px;
    cursor:pointer;
    border-bottom:1px solid #f1f1f1;
    color:#444;
}

.menu-item:hover{
    background:#f7f7f7;
}

.submenu{
    display:none;
    background:#fafafa;
}

.submenu a{
    display:block;
    padding:12px 35px;
    text-decoration:none;
    color:#666;
}

.submenu a:hover{
    background:#efefef;
}

.sidebar.collapsed .menu-text{
    display:none;
}

.sidebar.collapsed .submenu{
    display:none !important;
}

/* ==========================
   CONTEÚDO
========================== */

.content{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}


/* ==========================
   ABAS
========================== */

.tabs{
    width:100%;
    min-width:0;
    height:55px;
    flex-shrink:0;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:none;
    align-items:center;
    gap:30px;
    padding:0 25px;
    overflow-x:auto;
    overflow-y:hidden;
}


.tab{
    padding-bottom:10px;
    cursor:pointer;
    color:#888;
}

.tab.active{
    color:#333;
    border-bottom:3px solid #7cb342;
}
/* ==========================
   SUBABAS
========================== */

.subtabs{
    width:100%;
    min-width:0;
    min-height:50px;
    flex-shrink:0;
    background:#f7f8fa;
    border-bottom:1px solid #ddd;
    display:none;
    align-items:center;
    gap:10px;
    padding:6px 25px;
    overflow-x:auto;
    overflow-y:hidden;
}


.subtab{
    padding:9px 16px;
    border-radius:5px;
    cursor:pointer;
    color:#666;
    font-size:14px;
    transition:.2s;
}

.subtab:hover{
    background:#e9eded;
    color:#315858;
}

.subtab.active{
    background:#315858;
    color:#fff;
}



/* ==========================
   ÁREA CENTRAL
========================== */

.main{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}



.welcome h1{
    font-size:40px;
    color:#444;
    margin-bottom:15px;
}

.welcome p{
    font-size:18px;
    color:#777;
    margin-bottom:8px;
}

/* ==========================
   PAINEL DIREITO
========================== */

.right-panel{
width:280px;
min-width:280px;
flex-shrink:0;
background:#fff;
border-left:1px solid #ddd;
transition:.3s;
position:relative;
} 

.right-panel.collapsed{
width:20px;
min-width:20px;
} 
.right-content{
    padding:20px;
}

.right-panel.collapsed .right-content{
    display:none;
}

.toggle-right{
    position:absolute;
    left:-13px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
}

.info-card{
    margin-bottom:25px;
}

.info-card h3{
    margin-bottom:8px;
    color:#555;
    font-size:15px;
}

.info-card p{
    color:#888;
    font-size:14px;
    margin-bottom:5px;

<script>

let SAR_MENU_COMPLETO = [];
let SAR_USUARIO_ATUAL = null;
let SAR_CADASTRO_ATUAL = null;

let SAR_PERMISSOES_ATUAIS = [];
let SAR_PERMISSOES_POR_CODIGO = new Map();

async function carregarEstruturaMenuSupabase(){

    const supabase = window.SARGuard?.supabase;

    if(!supabase){
        throw new Error(
            "Conexão segura com o Supabase não disponível."
        );
    }

    /*
      A estrutura visual continua exatamente igual:

      Módulo → Aba → Subaba

      A única alteração é a fonte dos dados.
      Agora o sistema lê diretamente public.sar_modulos
      e monta internamente o mesmo formato que antes
      era fornecido por vw_sar_menu_completo.
    */
    const { data, error } = await supabase
        .from("sar_modulos")
        .select(`
            id,
            codigo,
            modulo,
            submodulo,
            icone,
            rota,
            categoria,
            modulo_pai,
            ordem,
            ordem_menu,
            ativo,
            exibir_menu_logado,
            status_desenvolvimento,
            em_breve
        `)
        .eq("ativo", true)
        .eq("exibir_menu_logado", true);

    if(error){
        throw error;
    }

    const registros = data || [];
    const porId = new Map();

    registros.forEach(function(item){
        porId.set(String(item.id), item);
    });

    function ordemDoItem(item){
        const ordemMenu = Number(item?.ordem_menu);
        const ordemGeral = Number(item?.ordem);

        if(Number.isFinite(ordemMenu)){
            return ordemMenu;
        }

        if(Number.isFinite(ordemGeral)){
            return ordemGeral;
        }

        return 999999;
    }

    function ordenarItens(a, b){

        const diferencaOrdem =
            ordemDoItem(a) - ordemDoItem(b);

        if(diferencaOrdem !== 0){
            return diferencaOrdem;
        }

        return String(a?.modulo || "")
            .localeCompare(
                String(b?.modulo || ""),
                "pt-BR"
            );
    }

    const filhosPorPai = new Map();

    registros.forEach(function(item){

        if(!item.modulo_pai){
            return;
        }

        const idPai = String(item.modulo_pai);

        if(!filhosPorPai.has(idPai)){
            filhosPorPai.set(idPai, []);
        }

        filhosPorPai.get(idPai).push(item);
    });

    filhosPorPai.forEach(function(filhos){
        filhos.sort(ordenarItens);
    });

    const modulosPrincipais = registros
        .filter(function(item){
            return !item.modulo_pai;
        })
        .sort(ordenarItens);

    const estruturaConvertida = [];

    modulosPrincipais.forEach(function(modulo){

        const abas =
            filhosPorPai.get(String(modulo.id)) || [];

        /*
          Mesmo que o módulo ainda não tenha abas,
          ele continua aparecendo no menu lateral.
        */
        if(abas.length === 0){

            estruturaConvertida.push({
                modulo_id: modulo.id,
                modulo_codigo: modulo.codigo,
                modulo_nome: modulo.modulo,
                modulo_icone: modulo.icone,
                modulo_ordem: ordemDoItem(modulo),
                modulo_rota: modulo.rota,
                modulo_status_desenvolvimento:
                    modulo.status_desenvolvimento,
                modulo_em_breve: modulo.em_breve,

                aba_id: null,
                aba_codigo: null,
                aba_nome: null,
                aba_icone: null,
                aba_ordem: null,
                aba_rota: null,

                subaba_id: null,
                subaba_codigo: null,
                subaba_nome: null,
                subaba_icone: null,
                subaba_ordem: null,
                subaba_rota: null
            });

            return;
        }

        abas.forEach(function(aba){

            const subabas =
                filhosPorPai.get(String(aba.id)) || [];

            /*
              Aba sem subaba: mantém a rota diretamente
              na aba superior, como já ocorre hoje.
            */
            if(subabas.length === 0){

                estruturaConvertida.push({
                    modulo_id: modulo.id,
                    modulo_codigo: modulo.codigo,
                    modulo_nome: modulo.modulo,
                    modulo_icone: modulo.icone,
                    modulo_ordem: ordemDoItem(modulo),
                    modulo_rota: modulo.rota,
                    modulo_status_desenvolvimento:
                        modulo.status_desenvolvimento,
                    modulo_em_breve: modulo.em_breve,

                    aba_id: aba.id,
                    aba_codigo: aba.codigo,
                    aba_nome: aba.modulo,
                    aba_icone: aba.icone,
                    aba_ordem: ordemDoItem(aba),
                    aba_rota: aba.rota,
                    aba_status_desenvolvimento:
                        aba.status_desenvolvimento,
                    aba_em_breve: aba.em_breve,

                    subaba_id: null,
                    subaba_codigo: null,
                    subaba_nome: null,
                    subaba_icone: null,
                    subaba_ordem: null,
                    subaba_rota: null
                });

                return;
            }

            subabas.forEach(function(subaba){

                estruturaConvertida.push({
                    modulo_id: modulo.id,
                    modulo_codigo: modulo.codigo,
                    modulo_nome: modulo.modulo,
                    modulo_icone: modulo.icone,
                    modulo_ordem: ordemDoItem(modulo),
                    modulo_rota: modulo.rota,
                    modulo_status_desenvolvimento:
                        modulo.status_desenvolvimento,
                    modulo_em_breve: modulo.em_breve,

                    aba_id: aba.id,
                    aba_codigo: aba.codigo,
                    aba_nome: aba.modulo,
                    aba_icone: aba.icone,
                    aba_ordem: ordemDoItem(aba),
                    aba_rota: aba.rota,
                    aba_status_desenvolvimento:
                        aba.status_desenvolvimento,
                    aba_em_breve: aba.em_breve,

                    subaba_id: subaba.id,
                    subaba_codigo: subaba.codigo,
                    subaba_nome: subaba.modulo,
                    subaba_icone: subaba.icone,
                    subaba_ordem: ordemDoItem(subaba),
                    subaba_rota: subaba.rota,
                    subaba_status_desenvolvimento:
                        subaba.status_desenvolvimento,
                    subaba_em_breve: subaba.em_breve
                });
            });
        });
    });

    /*
      Registros órfãos não são exibidos, pois não possuem
      uma cadeia válida Módulo → Aba → Subaba.
      O aviso facilita localizar eventual erro no cadastro.
    */
    registros.forEach(function(item){

        if(
            item.modulo_pai &&
            !porId.has(String(item.modulo_pai))
        ){
            console.warn(
                "Módulo ignorado porque o pai não foi encontrado:",
                item.codigo,
                item.modulo_pai
            );
        }
    });

    SAR_MENU_COMPLETO = estruturaConvertida;
}


async function carregarMinhasPermissoes(){

    const supabase =
        window.SARGuard?.supabase;

    if(!supabase){
        throw new Error(
            "Conexão segura com o Supabase não disponível."
        );
    }

    const { data, error } = await supabase.rpc(
        "sar_minhas_permissoes"
    );

    if(error){
        throw error;
    }

    SAR_PERMISSOES_ATUAIS = data || [];
    SAR_PERMISSOES_POR_CODIGO = new Map();

    SAR_PERMISSOES_ATUAIS.forEach(function(item){

        const codigo =
            String(item.codigo || "")
                .trim()
                .toUpperCase();

        if(codigo){
            SAR_PERMISSOES_POR_CODIGO.set(
                codigo,
                item
            );
        }
    });
}


function obterPermissao(codigo){

    const codigoNormalizado =
        String(codigo || "")
            .trim()
            .toUpperCase();

    return (
        SAR_PERMISSOES_POR_CODIGO.get(
            codigoNormalizado
        ) || null
    );
}


function podeVisualizar(codigo){

    const codigoNormalizado =
        String(codigo || "")
            .trim()
            .toUpperCase();

    /*
      A tela inicial permanece disponível
      para qualquer usuário ativo.
    */
    if(codigoNormalizado === "INICIO"){
        return true;
    }

    return (
        obterPermissao(codigoNormalizado)
            ?.visualizar === true
    );
}


function podeEditar(codigo){

    return (
        obterPermissao(codigo)
            ?.editar === true
    );
}


function podeExcluir(codigo){

    return (
        obterPermissao(codigo)
            ?.excluir === true
    );
}


function podeAdministrar(codigo){

        obterPermissao(codigo)
            ?.administrar === true

}

let SAR_HOME_MODULOS = [];

function sarEscaparHtml(valor){
    return String(valor ?? '').replace(/[&<>"']/g, function(caractere){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[caractere];
    });
}

async function carregarModulosHome(){
    const supabase = window.SARGuard?.supabase;

    const {data,error} = await supabase.from('sar_modulos')
        .select('id,codigo,modulo,descricao,descricao_card,icone,ativo,modulo_pai,exibir_na_home,ordem_home')
        .eq('ativo',true).eq('exibir_na_home',true)
        .order('ordem_home',{ascending:true});

function mostrarHome(){
    document.getElementById('tabs').style.display = 'none';
    esconderSubabas();
    const area = document.getElementById('mainContent');
    area.classList.add('sar-home-mode');
    // A estrutura de menu é a referência de navegação. Ela inclui módulos,
    // abas e subabas, mas apenas registros ativos e visíveis no menu.
    const codigosNavegaveis = new Set();
    SAR_MENU_COMPLETO.forEach(function(linha){
        ['modulo_codigo','aba_codigo','subaba_codigo'].forEach(function(chave){
            const codigo = String(linha[chave] || '').trim().toUpperCase();
            if(codigo){ codigosNavegaveis.add(codigo); }
        });
    });
    const autorizados = SAR_HOME_MODULOS.filter(function(item){
        const codigo = String(item.codigo || '').trim().toUpperCase();
        return item.ativo === true && item.exibir_na_home === true &&
            codigosNavegaveis.has(codigo) && podeVisualizar(codigo);
    }).sort(function(a,b){
        return Number(a.ordem_home || 0)-Number(b.ordem_home || 0) ||
            String(a.modulo || '').localeCompare(String(b.modulo || ''),'pt-BR');
    });
    const cards = autorizados.map(function(item){
        const nome = sarEscaparHtml(item.modulo || item.codigo);
        const descricao = sarEscaparHtml(item.descricao_card || item.descricao || 'Acessar módulo do SAR');
        const icone = sarEscaparHtml(obterIconeModulo(item.icone));
        const codigo = sarEscaparHtml(String(item.codigo || '').trim().toUpperCase());
        return `<button type="button" class="sar-home-card" data-sar-home-codigo="${codigo}">
            <span class="sar-home-card-icon" aria-hidden="true">${icone}</span>
            <span class="sar-home-card-title">${nome}</span>
            <span class="sar-home-card-desc">${descricao}</span>
        </button>`;
    }).join('');
    area.innerHTML = `<section class="sar-home">
        <div class="sar-home-banner">
            <img src="assets/imagens/sar-banner-boas-vindas.png" alt="Seja bem-vindo(a)! SAR Engenharia — Onde a norma encontra a resposta. Plataforma de engenharia e segurança contra incêndio." loading="eager">
        </div>
        <div class="sar-home-heading"><h2>Módulos do Sistema</h2><p>Disponíveis conforme suas permissões</p></div>
        ${cards ? `<div class="sar-home-grid">${cards}</div>` : '<div class="sar-home-empty">Nenhum módulo habilitado para sua página inicial no momento.</div>'}
    </section>`;
    area.querySelectorAll('[data-sar-home-codigo]').forEach(function(botao){
        botao.addEventListener('click',function(){ sarAbrirCardHome(botao.dataset.sarHomeCodigo); });
    });
}

// Abre cards usando as rotinas existentes e a estrutura de menu autorizada.
function sarAbrirCardHome(codigoInformado){
    const codigo = String(codigoInformado || '').trim().toUpperCase();
    if(!podeVisualizar(codigo)){
        mostrarAcessoNegado(codigo);
        return;
    }
    const linhaModulo = SAR_MENU_COMPLETO.find(function(item){
        return String(item.modulo_codigo || '').trim().toUpperCase() === codigo;
    });
    if(linhaModulo){
        abrirModulo(codigo);
        return;
    }
    const linhaAba = SAR_MENU_COMPLETO.find(function(item){
        return String(item.aba_codigo || '').trim().toUpperCase() === codigo;
    });
    if(linhaAba){
        const pai = String(linhaAba.modulo_codigo || '').trim().toUpperCase();
        if(!podeVisualizar(pai)){ mostrarAcessoNegado(pai); return; }
        abrirModulo(pai);
        abrirAba(pai,codigo,linhaAba.aba_nome,linhaAba.aba_rota || '',null);
        return;
    }
    const linhaSubaba = SAR_MENU_COMPLETO.find(function(item){
        return String(item.subaba_codigo || '').trim().toUpperCase() === codigo;
    });
    if(linhaSubaba){
        const pai = String(linhaSubaba.modulo_codigo || '').trim().toUpperCase();
        const aba = String(linhaSubaba.aba_codigo || '').trim().toUpperCase();
        if(!podeVisualizar(pai) || !podeVisualizar(aba)){
            mostrarAcessoNegado(codigo);
            return;
        }
        abrirModulo(pai);
        abrirAba(pai,aba,linhaSubaba.aba_nome,linhaSubaba.aba_rota || '',null);
        abrirSubaba(codigo,linhaSubaba.subaba_rota || '',null);
    }
}

    document.getElementById(
        "tabs"
    ).style.display = "none";

    esconderSubabas();

    document.getElementById(
        "mainContent"
    ).innerHTML = `
        <div class="welcome">
            <h1>Acesso não autorizado</h1>
            <p>
                O recurso <b>${nomeRecurso}</b>
                não está liberado para seu usuário.
            </p>
        </div>
    `;
}


function abrirModulo(modulo){
    document.getElementById("mainContent").classList.remove("sar-home-mode");

    const codigoModulo =
        String(modulo || "")
            .trim()
            .toUpperCase();

    if(codigoModulo === "INICIO"){
        mostrarHome();
        return;
    }

    if(!podeVisualizar(codigoModulo)){
        mostrarAcessoNegado(codigoModulo);
        return;
    }

    /*
      Procura o módulo principal dentro da estrutura
      carregada diretamente do Supabase.
    */
    const registroModulo =
        SAR_MENU_COMPLETO.find(function(item){

            return (
                String(item.modulo_codigo || "")
                    .trim()
                    .toUpperCase() === codigoModulo
            );
        });

    const rotaModulo =
        String(
            registroModulo?.modulo_rota || ""
        ).trim();

    /*
      Verifica se o módulo possui abas filhas.
    */
    const possuiAbas =
        SAR_MENU_COMPLETO.some(function(item){

            return (
                String(item.modulo_codigo || "")
                    .trim()
                    .toUpperCase() === codigoModulo
                &&
                item.aba_id
            );
        });

    /*
      Módulo principal com rota e sem abas:
      abre diretamente o arquivo cadastrado no admin.
    */
    if(rotaModulo && !possuiAbas){

        document.getElementById(
            "tabs"
        ).style.display = "none";

        esconderSubabas();

        abrirArquivo(
            rotaModulo,
            codigoModulo
        );

        return;
    }

    /*
      Módulo com abas:
      mantém o comportamento atual.
    */
    esconderSubabas();
    carregarAbas(codigoModulo);

    document.getElementById(
        "mainContent"
    ).innerHTML = `
        <div class="welcome">
            <h1>${registroModulo?.modulo_nome || modulo}</h1>
            <p>Selecione uma ferramenta acima.</p>
        </div>
    `;
}


function abrirArquivo(arquivo, codigoRecurso = ""){
    document.getElementById("mainContent").classList.remove("sar-home-mode");

    const codigoNormalizado =
        String(codigoRecurso || "")
            .trim()
            .toUpperCase();

    if(
        codigoNormalizado &&
        !podeVisualizar(codigoNormalizado)
    ){
        mostrarAcessoNegado(codigoNormalizado);
        return false;
    }

    document.getElementById("mainContent").innerHTML = `

        <iframe
            src="${arquivo}"
            style="
                width:100%;
                height:100%;
                border:none;
                background:white;
            ">
        </iframe>

    `;

    return true;
}


function carregarAbas(modulo){

    const codigoModulo = String(modulo || "")
        .trim()
        .toUpperCase();

    const abasMap = new Map();

    SAR_MENU_COMPLETO.forEach(function(item){

        const moduloLinha =
            String(item.modulo_codigo || "")
                .trim()
                .toUpperCase();

        if(
            moduloLinha !== codigoModulo ||
            !item.aba_id ||
            !podeVisualizar(item.aba_codigo)
        ){
            return;
        }

        if(!abasMap.has(item.aba_id)){

            abasMap.set(item.aba_id, {
                id: item.aba_id,
                codigo: item.aba_codigo,
                nome: item.aba_nome,
                icone: item.aba_icone,
                ordem: item.aba_ordem,
                arquivo: item.aba_rota
            });
        }
    });

    const abasEncontradas =
        Array.from(abasMap.values())
            .sort(function(a, b){
                return Number(a.ordem || 0) -
                       Number(b.ordem || 0);
            });

    let htmlAbas = "";

    abasEncontradas.forEach(function(aba){

        htmlAbas += `
            <div
                class="tab"
                onclick='abrirAba(
                    ${JSON.stringify(codigoModulo)},
                    ${JSON.stringify(aba.codigo)},
                    ${JSON.stringify(aba.nome)},
                    ${JSON.stringify(aba.arquivo || "")},
                    this
                )'
            >
                ${aba.nome}
            </div>
        `;
    });

    const tabs =
        document.getElementById("tabs");

    tabs.innerHTML = htmlAbas;

    tabs.style.display =
        abasEncontradas.length > 0
            ? "flex"
            : "none";

    esconderSubabas();
}



/* =========================================
   ABRIR ABA PRINCIPAL
========================================= */

function abrirAba(
    modulo,
    codigoAba,
    nomeAba,
    arquivo,
    elementoClicado
){

    const codigoAbaNormalizado =
        String(codigoAba || "")
            .trim()
            .toUpperCase();

    if(!podeVisualizar(codigoAbaNormalizado)){
        mostrarAcessoNegado(nomeAba || codigoAbaNormalizado);
        return;
    }

    marcarAbaAtiva(elementoClicado);

    const possuiSubabas =
        carregarSubabas(
            modulo,
            codigoAba,
            nomeAba
        );

    if(possuiSubabas){
        return;
    }

    esconderSubabas();

    if(arquivo && arquivo.trim() !== ""){
        abrirArquivo(
            arquivo,
            codigoAbaNormalizado
        );
        return;
    }

    document.getElementById(
        "mainContent"
    ).innerHTML = `
        <div class="welcome">
            <h1>${nomeAba}</h1>
            <p>Nenhuma ferramenta ativa cadastrada.</p>
        </div>
    `;
}



/* =========================================
   CARREGAR SUBABAS
========================================= */
function carregarSubabas(
    modulo,
    codigoAba,
    nomeAba
){

    try{

        const moduloSelecionado =
            String(modulo || "")
                .trim()
                .toUpperCase();

        const abaSelecionada =
            String(codigoAba || "")
                .trim()
                .toUpperCase();

        const subabasMap = new Map();

        SAR_MENU_COMPLETO.forEach(function(item){

            const moduloLinha =
                String(item.modulo_codigo || "")
                    .trim()
                    .toUpperCase();

            const abaLinha =
                String(item.aba_codigo || "")
                    .trim()
                    .toUpperCase();

            if(
                moduloLinha !== moduloSelecionado ||
                abaLinha !== abaSelecionada ||
                !item.subaba_id ||
                !podeVisualizar(item.subaba_codigo)
            ){
                return;
            }

            if(!subabasMap.has(item.subaba_id)){

                subabasMap.set(item.subaba_id, {
                    id: item.subaba_id,
                    codigo: item.subaba_codigo,
                    nome: item.subaba_nome,
                    arquivo: item.subaba_rota,
                    ordem: item.subaba_ordem
                });
            }
        });

        const subabasEncontradas =
            Array.from(subabasMap.values())
                .sort(function(a, b){
                    return Number(a.ordem || 0) -
                           Number(b.ordem || 0);
                });

        if(subabasEncontradas.length === 0){

            esconderSubabas();

            return false;
        }

        const subtabs =
            document.getElementById("subtabs");

        let htmlSubabas = "";

        subabasEncontradas.forEach(function(subaba){

            htmlSubabas += `
                <div
                    class="subtab"
                    onclick='abrirSubaba(
                        ${JSON.stringify(
                            subaba.codigo || ""
                        )},
                        ${JSON.stringify(
                            subaba.arquivo || ""
                        )},
                        this
                    )'
                >
                    ${subaba.nome}
                </div>
            `;
        });

        subtabs.innerHTML = htmlSubabas;
        subtabs.style.display = "flex";

        document.getElementById(
            "mainContent"
        ).innerHTML = `
            <div class="welcome">
                <h1>${nomeAba}</h1>
                <p>Selecione uma ferramenta acima.</p>
            </div>
        `;

        return true;

    }catch(erro){

        console.error(
            "Erro ao carregar subabas:",
            erro
        );

        esconderSubabas();

        return false;
    }
}



/* =========================================
   ABRIR SUBABA
========================================= */

function abrirSubaba(
    codigoSubaba,
    arquivo,
    elementoClicado
){

    const codigoNormalizado =
        String(codigoSubaba || "")
            .trim()
            .toUpperCase();

    if(!podeVisualizar(codigoNormalizado)){
        mostrarAcessoNegado(codigoNormalizado);
        return;
    }

    marcarSubabaAtiva(elementoClicado);

    if(!arquivo || arquivo.trim() === ""){

        document.getElementById("mainContent").innerHTML = `
            <div class="welcome">
                <h1>Ferramenta não cadastrada</h1>
                <p>Verifique o endereço do arquivo no banco de subabas.</p>
            </div>
        `;

        return;
    }

    abrirArquivo(
        arquivo,
        codigoNormalizado
    );
}


/* =========================================
   MARCAR ABA PRINCIPAL ATIVA
========================================= */

function marcarAbaAtiva(elementoAtivo){

    const abas =
        document.querySelectorAll("#tabs .tab");

    abas.forEach(function(aba){
        aba.classList.remove("active");
    });

    if(elementoAtivo){
        elementoAtivo.classList.add("active");
    }
}


/* =========================================
   MARCAR SUBABA ATIVA
========================================= */

function marcarSubabaAtiva(elementoAtivo){

    const subabas =
        document.querySelectorAll("#subtabs .subtab");

    subabas.forEach(function(subaba){
        subaba.classList.remove("active");
    });

    if(elementoAtivo){
        elementoAtivo.classList.add("active");
    }
}


/* =========================================
   ESCONDER SUBABAS
========================================= */

function esconderSubabas(){

    const subtabs =
        document.getElementById("subtabs");

    subtabs.innerHTML = "";
    subtabs.style.display = "none";
}

/* =========================================
   CARREGAR MENU DO RODAPÉ
========================================= */

async function carregarMenuRodape(){

    try{

        const supabase =
            window.SARGuard?.supabase;

        if(!supabase){

            throw new Error(
                "Conexão segura com o Supabase não disponível."
            );
        }

        const { data, error } = await supabase
            .from("sar_menu_rodape")
            .select(`
                codigo,
                titulo,
                icone,
                tipo,
                destino,
                ordem,
                ativo,
                somente_master
            `)
            .eq("ativo", true)
            .order("ordem", {
                ascending: true
            });

        if(error){
    throw error;
}

const ehMaster =
    String(
        SAR_CADASTRO_ATUAL?.tipo_usuario || ""
    ).toLowerCase() === "master";

let html = "";

(data || []).forEach(function(item){

    if(
        item.somente_master === true &&
        !ehMaster
    ){
        return;
    }

            const classeSair =
                String(item.destino || "")
                    .trim()
                    .toUpperCase() === "SAIR"
                    ? " logout"
                    : "";

            html += `
                <button
                    class="sidebar-footer-btn${classeSair}"
                    type="button"
                    title="${item.titulo}"
                    aria-label="${item.titulo}"
                    onclick='executarItemRodape(
                        ${JSON.stringify(item.tipo)},
                        ${JSON.stringify(item.destino)}
                    )'
                >
                    ${item.icone}
                </button>
            `;
        });

        document.getElementById(
            "menuRodape"
        ).innerHTML = html;

    }catch(erro){

        console.error(
            "Erro ao carregar menu do rodapé:",
            erro
        );

        document.getElementById(
            "menuRodape"
        ).innerHTML = "";
    }
}



/* =========================================
   EXECUTAR ITEM DO RODAPÉ
========================================= */

function executarItemRodape(tipo, destino){

    const tipoSelecionado =
        String(tipo || "")
            .trim()
            .toUpperCase();

    const destinoSelecionado =
        String(destino || "")
            .trim()
            .toUpperCase();

    if(
        tipoSelecionado === "ACAO" &&
        destinoSelecionado === "SAIR"
    ){
        sairDoSistema();
        return;
    }

if(
        tipoSelecionado === "ACAO" &&
        destinoSelecionado === "ADMINISTRACAO"
    ){
        document.getElementById(
            "tabs"
        ).style.display = "none";

        esconderSubabas();

        abrirArquivo(
            "admin.html",
            "ADMINISTRACAO"
        );

        return;
    }

if(
        tipoSelecionado === "ACAO" &&
        destinoSelecionado === "MEU_PERFIL"
    ){
        document.getElementById(
            "tabs"
        ).style.display = "none";

        esconderSubabas();

        document.getElementById(
            "mainContent"
        ).innerHTML = `
            <div class="welcome">
                <h1>Meu Perfil</h1>
                <p>Área de perfil em desenvolvimento.</p>
            </div>
        `;

        return;
    }

    
    if(
        tipoSelecionado === "ACAO" &&
        destinoSelecionado === "INFORMACOES"
    ){
        esconderSubabas();

        document.getElementById(
            "tabs"
        ).style.display = "none";

        document.getElementById(
            "mainContent"
        ).innerHTML = `
            <div class="welcome">
                <h1>Informações</h1>
                <p>SAR – Sistema Avançado de Resposta</p>
                <p>Versão Beta</p>
            </div>
        `;

        return;
    }

    if(
        tipoSelecionado === "ACAO" &&
        destinoSelecionado === "AJUDA"
    ){
        esconderSubabas();

        document.getElementById(
            "tabs"
        ).style.display = "none";

        document.getElementById(
            "mainContent"
        ).innerHTML = `
            <div class="welcome">
                <h1>Ajuda</h1>
                <p>Central de ajuda em desenvolvimento.</p>
            </div>
        `;

        return;
    }

    if(tipoSelecionado === "MODULO"){

        abrirModulo(destinoSelecionado);
        return;
    }

    console.warn(
        "Item do rodapé sem ação cadastrada:",
        tipo,
        destino
    );
}

/* =========================================
   SAIR DO SISTEMA
========================================= */

async function sairDoSistema(){

    try{

        if(
            window.SARGuard &&
            typeof window.SARGuard.sair === "function"
        ){
            await window.SARGuard.sair();
            return;
        }

        console.warn(
            "SARGuard não disponível. Redirecionando para acesso."
        );

        window.location.replace("acesso.html");

    }catch(erro){

        console.error(
            "Erro ao sair do sistema:",
            erro
        );

        window.location.replace("acesso.html");
    }
}



/* =========================================
   IMPRIMIR FERRAMENTA ATUAL
========================================= */

function imprimirFerramentaAtual(){

    const iframe =
        document.querySelector("#mainContent iframe");

    if(!iframe){

        alert(
            "Abra uma ferramenta antes de imprimir o resultado."
        );

        return;
    }

    try{

        const documentoIframe =
            iframe.contentDocument ||
            iframe.contentWindow.document;

        let estiloImpressao =
            documentoIframe.getElementById(
                "sar-impressao-universal"
            );

        if(!estiloImpressao){

            estiloImpressao =
                documentoIframe.createElement("style");

            estiloImpressao.id =
                "sar-impressao-universal";

            estiloImpressao.textContent = `
                @media print {

                    @page{
                        size:A4 portrait;
                        margin:6mm;
                    }

                    html,
                    body{
                        width:100% !important;
                        height:auto !important;
                        margin:0 !important;
                        padding:0 !important;
                        overflow:visible !important;
                        background:#fff !important;
                    }

                    body{
                        zoom:0.50;
                    }

                    button,
                    [type="button"],
                    [type="submit"],
                    .botoes,
                    .acoes,
                    .actions,
                    .no-print{
                        display:none !important;
                    }

                    *{
                        box-shadow:none !important;
                    }
                }
            `;

            documentoIframe.head.appendChild(
                estiloImpressao
            );
        }

        iframe.contentWindow.focus();
        iframe.contentWindow.print();

    }catch(erro){

        console.error(
            "Erro ao imprimir a ferramenta:",
            erro
        );

        alert(
            "Não foi possível imprimir esta ferramenta."
        );
    }
}



/* Nome e perfil provenientes da sessao autenticada (sem dados fixos). */
function preencherUsuarioTopo(usuario, cadastro){
    const meta = usuario?.user_metadata || {};
    const nome = String(meta.full_name || meta.name || meta.nome || usuario?.email?.split("@")[0] || "Usuário SAR").trim();
    const partes = nome.split(/\s+/).filter(Boolean);
    const iniciais = ((partes[0]?.[0] || "U") + (partes.length > 1 ? partes[partes.length - 1][0] : "")).toUpperCase();
    const perfil = String(cadastro?.tipo_usuario || "Usuário").trim();
    const perfilExibicao = perfil ? perfil.charAt(0).toUpperCase() + perfil.slice(1).toLowerCase() : "Usuário";
    document.getElementById("sarUserNome").textContent = nome;
    document.getElementById("sarUserAvatar").textContent = iniciais;
    document.getElementById("sarUserCargo").textContent = perfilExibicao;
    document.getElementById("sarUserMenuNome").textContent = nome;
    document.getElementById("sarUserMenuEmail").textContent = usuario?.email || "";
}
function alternarMenuUsuario(){
    const menu = document.getElementById("sarUserMenu");
    const botao = document.getElementById("sarUserTrigger");
    menu.hidden = !menu.hidden;
    botao.setAttribute("aria-expanded", String(!menu.hidden));
}
document.addEventListener("click", function(event){
    const area = document.getElementById("sarUserArea");
    const menu = document.getElementById("sarUserMenu");
    if(area && menu && !area.contains(event.target)){
        menu.hidden = true;
        document.getElementById("sarUserTrigger").setAttribute("aria-expanded", "false");
    }
});

window.addEventListener(
    "sar:autorizado",
    async function(event){

        SAR_USUARIO_ATUAL =
            event.detail?.usuario || null;

        SAR_CADASTRO_ATUAL =
            event.detail?.cadastro || null;

        preencherUsuarioTopo(SAR_USUARIO_ATUAL, SAR_CADASTRO_ATUAL);

        try{

            await carregarEstruturaMenuSupabase();

            await carregarMinhasPermissoes();

            carregarModulos();

            try{
                await carregarModulosHome();
            }catch(erroHome){
                SAR_HOME_MODULOS = [];
                console.error('Não foi possível carregar os cards da Home:', erroHome);
            }
            mostrarHome();

            await carregarMenuRodape();

        }catch(erro){

            console.error(
                "Erro ao inicializar o menu do SAR:",
                erro
            );

            document.getElementById(
                "menuDinamico"
            ).innerHTML = `
                <div class="menu-item">
                    Erro ao carregar menu
                </div>
            `;
        }
    }
);
