<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>GAME ClassificaTOR | Fase 2</title>
  <script src="/js/sar.page-guard.js"></script>
  <link rel="stylesheet" href="/game-classificator/assets/classificator-shell.css">
  <style>
    .cards{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:18px;align-items:stretch}
    .option-card{position:relative;width:100%;padding:0;overflow:hidden;border:1px solid #dce4e1;border-radius:12px;background:#fff;text-align:center;cursor:pointer;transition:.18s}
    .option-card:hover{transform:translateY(-4px);border-color:#a7c3b2;box-shadow:0 8px 22px rgba(49,88,88,.12)}
    .option-card:focus-visible{outline:3px solid rgba(124,179,66,.35);outline-offset:3px}.option-card:disabled{cursor:wait;opacity:.58;transform:none;box-shadow:none}
    .card-image{width:100%;aspect-ratio:1.35/1;overflow:hidden;background:#edf2ef;border-bottom:1px solid #e7eeea}.card-image img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none;transition:transform .24s ease}.option-card:hover .card-image img{transform:scale(1.025)}
    .card-body{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 9px 14px}.card-title{margin:0;color:#315858;font-size:16px;font-weight:800;line-height:1.15;text-transform:uppercase;text-align:center}.card-subtitle{margin:0;color:#6e7d7d;font-size:13px;line-height:1.15;text-align:center}
    @media(max-width:1200px){.cards{grid-template-columns:repeat(2,minmax(250px,1fr))}}@media(max-width:720px){.cards{grid-template-columns:1fr}.option-card{max-width:560px;margin:0 auto}}
  </style>
</head>
<body>
  <div data-classificator-header data-stage="FASE_02"></div>

  <main class="page-shell">
    <header class="page-head">
      <div>
        <p class="page-eyebrow">Fase 2 — Tipologia da Edificação</p>
        <h1 class="page-title">Selecione a tipologia da edificação</h1>
        <p class="page-subtitle">Quantidade total de pavimentos da edificação, considerando o térreo.</p>
      </div>
      <div class="page-actions">
        <button class="ghost-btn" id="btnInicio" type="button">Início</button>
      </div>
    </header>

    <section class="workspace">
      <div class="cards">
        <button class="option-card" type="button" data-opcao="PAV_1_SEM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-1.png" alt="Edificação térrea" draggable="false"></div><div class="card-body"><h2 class="card-title">EDIFICAÇÃO TÉRREA</h2><p class="card-subtitle">1 pavimento</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_2_SEM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-2.png" alt="Térreo mais um pavimento" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 1 PAVIMENTO</h2><p class="card-subtitle">2 pavimentos</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_3_SEM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-3.png" alt="Térreo mais dois pavimentos" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 2 PAVIMENTOS</h2><p class="card-subtitle">3 pavimentos</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_4_MAIS_SEM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-4mais.png" alt="Térreo mais três pavimentos ou mais" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 3 PAVIMENTOS OU MAIS</h2><p class="card-subtitle">4 pavimentos ou mais</p></div></button>

        <button class="option-card" type="button" data-opcao="PAV_1_COM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-1-subsolo.png" alt="Edificação térrea com subsolo" draggable="false"></div><div class="card-body"><h2 class="card-title">EDIFICAÇÃO TÉRREA<br>COM SUBSOLO</h2><p class="card-subtitle">1 pavimento + subsolo</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_2_COM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-2-subsolo.png" alt="Térreo mais um pavimento com subsolo" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 1 PAVIMENTO<br>COM SUBSOLO</h2><p class="card-subtitle">2 pavimentos + subsolo</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_3_COM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-3-subsolo.png" alt="Térreo mais dois pavimentos com subsolo" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 2 PAVIMENTOS<br>COM SUBSOLO</h2><p class="card-subtitle">3 pavimentos + subsolo</p></div></button>
        <button class="option-card" type="button" data-opcao="PAV_4_MAIS_COM_SUBSOLO"><div class="card-image"><img src="/game-classificator/assets/fase02-pav-4mais-subsolo.png" alt="Térreo mais três pavimentos ou mais com subsolo" draggable="false"></div><div class="card-body"><h2 class="card-title">TÉRREO + 3 PAVIMENTOS OU MAIS<br>COM SUBSOLO</h2><p class="card-subtitle">4 pavimentos ou mais + subsolo</p></div></button>
      </div>
      <div class="status" id="statusFase" aria-live="polite"></div>
    </section>
  </main>

  <script src="/game-classificator/assets/classificator-shell.js"></script>
  <script>
    (()=>{
      "use strict";
      const btnInicio=document.getElementById("btnInicio"),status=document.getElementById("statusFase");
      const cards=[...document.querySelectorAll(".option-card[data-opcao]")];
      const travar=v=>cards.forEach(c=>c.disabled=v);
      btnInicio?.addEventListener("click",()=>window.location.assign("/game-classificator/fase-01/"));
      async function escrever(texto){status.textContent="";status.classList.add("escrevendo");for(let i=0;i<texto.length;i++){status.textContent+=texto.charAt(i);await new Promise(r=>setTimeout(r,20));}status.classList.remove("escrevendo")}
      async function responder(card){
        const opcao=String(card.dataset.opcao||"").trim();if(!opcao)return;travar(true);status.textContent="Analisando configuração...";
        try{
          const response=await fetch("/api/game/classificator/responder",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",Accept:"application/json","X-Requested-With":"SAR-ClassificaTOR"},body:JSON.stringify({fase:"fase-02",opcao})});
          const data=await response.json().catch(()=>null);
          if(!response.ok||!data?.ok)throw new Error(response.status===401?"Sua sessão expirou. Volte à Fase 1.":"Não foi possível registrar a configuração.");
          if(data.classificacao)window.SARClassificatorUI?.updateClassification(data.classificacao);
          await escrever(data.mensagem||"Configuração registrada.");
          if(data.next){await new Promise(r=>setTimeout(r,350));window.location.assign(data.next);return;}
          travar(false);
        }catch(err){console.error(err);status.classList.remove("escrevendo");status.textContent=err.message||"Não foi possível continuar. Tente novamente.";travar(false)}
      }
      cards.forEach(c=>c.addEventListener("click",()=>responder(c)));
    })();
  </script>
</body>
</html>
