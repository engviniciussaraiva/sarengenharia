<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>ClassificaTOR | Escolha do trajeto</title>
  <script src="/js/sar.page-guard.js"></script>
  <script src="/js/sar.api.js"></script>
  <script src="/game-classificator/assets/classificator-api.js"></script>
  <link rel="stylesheet" href="/game-classificator/assets/classificator-shell.css">
  <style>
    .route-shell{min-height:calc(100vh - 180px);padding:28px 0 44px;background:linear-gradient(135deg,#eef9f1 0%,#f8fcf9 55%,#e4f6e9 100%);position:relative;overflow:hidden}
    .route-shell::after{content:"";position:absolute;left:-80px;bottom:-120px;width:520px;height:340px;opacity:.16;background:repeating-linear-gradient(90deg,transparent 0 32px,#5cb58a 33px 34px),repeating-linear-gradient(0deg,transparent 0 32px,#5cb58a 33px 34px);transform:skewY(-10deg);pointer-events:none}
    .route-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px;position:relative;z-index:1}
    .route-kicker{margin:0 0 8px;color:#1a9b67;font-weight:900;font-size:12px;letter-spacing:.11em;text-transform:uppercase}.route-title{margin:0;color:#123c35;font-size:36px;line-height:1.06;letter-spacing:-.025em}.route-subtitle{margin:10px 0 0;color:#58756d;font-size:15px}
    .route-grid{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:18px;position:relative;z-index:1}
    .route-card{min-height:330px;padding:24px;border:1px solid #79c09d;border-radius:14px;background:rgba(255,255,255,.77);box-shadow:0 7px 20px rgba(13,81,63,.06);color:#133d35;text-align:left;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
    .route-card:hover{transform:translateY(-5px);border-color:#199966;box-shadow:0 14px 30px rgba(13,81,63,.12)}.route-card:disabled{opacity:.58;cursor:not-allowed;transform:none;box-shadow:none}.route-card.done{background:linear-gradient(180deg,#effbf4,#e4f6eb);border-color:#23a46f}
    .route-visual{height:160px;display:grid;place-items:center;color:#1a8b62}.route-visual svg{width:135px;height:135px;stroke:currentColor;fill:none;stroke-width:1.45}.route-card h2{margin:4px 0 8px;font-size:22px;line-height:1}.route-card p{margin:0;color:#58756d;font-size:14px}.route-card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:20px}.route-line{width:48px;height:4px;border-radius:99px;background:#1ba26c}.route-arrow{width:43px;height:43px;border:2px solid #1ba26c;border-radius:50%;display:grid;place-items:center;color:#13845a;font-size:24px}.route-done{display:none;color:#168a5e;font-weight:900;font-size:12px;text-transform:uppercase}.route-card.done .route-done{display:block}
    @media(max-width:1150px){.route-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.route-grid{grid-template-columns:1fr}.route-title{font-size:29px}.route-head{display:block}.route-head .page-actions{margin-top:16px}}
  </style>
</head>
<body>
  <div data-classificator-header data-stage="FASE_02"></div>
  <section class="route-shell">
    <main class="page-shell" style="margin-top:0">
      <header class="route-head">
        <div><p class="route-kicker">Fase 2 — Definição do trajeto</p><h1 class="route-title">Escolha por qual critério deseja iniciar</h1><p class="route-subtitle">Os critérios podem ser preenchidos na ordem que preferir.</p></div>
      </header>

      <div class="route-grid" id="routeGrid">
        <button class="route-card" type="button" disabled data-code="AREA" data-route="/game-classificator/fase-04/">
          <div class="route-visual"><svg viewBox="0 0 120 120"><path d="M21 83l37 18 41-20-38-17zM21 83V49l38-18 40 18v32M59 31v70M21 49l38 18 40-18"/><path d="M16 91l43 21 47-23M101 32h14M108 25v14"/></svg></div>
          <h2>ÁREA</h2><p>Área total construída</p><div class="route-card-footer"><span class="route-line"></span><span class="route-done">Determinado ✓</span><span class="route-arrow">→</span></div>
        </button>
        <button class="route-card" type="button" disabled data-code="ALTURA" data-route="/game-classificator/fase-03/">
          <div class="route-visual"><svg viewBox="0 0 120 120"><path d="M25 101V47h44v54zM35 47V27h34v20M40 58h11M40 69h11M40 80h11M78 24v75M72 31l6-7 6 7M72 92l6 7 6-7"/></svg></div>
          <h2>ALTURA</h2><p>Altura da edificação</p><div class="route-card-footer"><span class="route-line"></span><span class="route-done">Determinado ✓</span><span class="route-arrow">→</span></div>
        </button>
        <button class="route-card" type="button" disabled data-code="OCUPACAO" data-route="/game-classificator/fase-05/">
          <div class="route-visual"><svg viewBox="0 0 120 120"><path d="M18 91V49h29v42M49 91V34h30v57M81 91V57h22v34M12 96h96"/><circle cx="58" cy="53" r="6"/><circle cx="47" cy="72" r="5"/><circle cx="68" cy="72" r="5"/><path d="M36 91v-4c0-7 5-12 11-12M80 91v-4c0-7-5-12-11-12M49 91v-7c0-8 4-13 10-13s10 5 10 13v7"/></svg></div>
          <h2>OCUPAÇÃO</h2><p>Grupo e divisão de uso</p><div class="route-card-footer"><span class="route-line"></span><span class="route-done">Determinado ✓</span><span class="route-arrow">→</span></div>
        </button>
        <button class="route-card" type="button" disabled data-code="CRITERIOS" data-route="/game-classificator/fase-06/">
          <div class="route-visual"><svg viewBox="0 0 120 120"><rect x="28" y="18" width="59" height="82" rx="6"/><path d="M41 42l5 5 9-11M41 62l5 5 9-11M41 82l5 5 9-11M62 42h14M62 62h14M62 82h14"/><path d="M83 75l16 7v13c0 9-7 15-16 18-9-3-16-9-16-18V82z"/></svg></div>
          <h2>CRITÉRIO TÉCNICO</h2><p>Demais exigências normativas</p><div class="route-card-footer"><span class="route-line"></span><span class="route-done">Determinado ✓</span><span class="route-arrow">→</span></div>
        </button>
      </div>
    </main>
  </section>

  <script src="/game-classificator/assets/classificator-shell.js"></script>
  <script>
    (()=>{
      "use strict";
      const cards=[...document.querySelectorAll(".route-card")];
      cards.forEach(card=>card.addEventListener("click",()=>window.location.assign(card.dataset.route)));
      function aplicarEstado(state){
        state=state||{};
        if(state.implantacao_concluida!==true){
          window.location.replace("/game-classificator/fase-01/");
          return;
        }
        const criteria=state.criterios||[];
        for(const card of cards){
          const item=criteria.find(c=>c.codigo===card.dataset.code);
          const enabled=item?.habilitado===true;
          card.disabled=!enabled;
          card.classList.toggle("done",Boolean(item?.concluido));
        }
      }
      window.addEventListener("sar:classificator-state",e=>aplicarEstado(e.detail));
      const initialState=window.SARClassificatorUI?.getState?.();
      if(initialState) aplicarEstado(initialState);
    })();
  </script>
</body>
</html>
