<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090b" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" />

  <title>GAME ClassificaTOR | SAR Engenharia</title>
  <link rel="stylesheet" href="./game.css" />
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="game-shell" aria-label="GAME ClassificaTOR">
    <section class="poster" aria-label="Tela inicial do GAME ClassificaTOR">
      <img
        class="poster-image"
        src="./assets/tela-01.png"
        alt="GAME ClassificaTOR. Vamos descobrir qual é a classificação da edificação? Capacete branco de engenheiro com botão Iniciar e SAR Engenharia."
        draggable="false"
      />

      <!--
        O botão fica sobre a área do capacete da arte aprovada.
        Nenhuma regra normativa existe nesta página.
      -->
      <button
        id="btnIniciar"
        class="helmet-hit-area"
        type="button"
        aria-label="Iniciar GAME ClassificaTOR"
      >
        <span class="sr-only">Iniciar GAME ClassificaTOR</span>
      </button>

      <div id="statusGame" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
