<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="sar-recurso-codigo"
    content="GAME_CLASSIFICATOR"
  >

  <title>GAME ClassificaTOR | SAR Engenharia</title>

  <script src="/js/sar.page-guard.js"></script>

  <link
    rel="stylesheet"
    href="/game-classificator/game.css"
  >

  <script
    src="/game-classificator/game.js"
    defer
  ></script>
</head>

<body>

  <main class="game-shell">

    <!--
      A IMAGEM INTEIRA É CLICÁVEL.
      Não existe botão extra aparecendo na tela.
    -->
    <button
      id="btnIniciar"
      class="poster-button"
      type="button"
      aria-label="Iniciar GAME ClassificaTOR"
    >

      <img
        class="poster-image"
        src="/game-classificator/assets/tela-01.png"
        alt="GAME ClassificaTOR - SAR Engenharia"
        draggable="false"
      >

    </button>

    <div
      id="statusGame"
      class="status-game"
      aria-live="polite"
    ></div>

  </main>

</body>
</html>
