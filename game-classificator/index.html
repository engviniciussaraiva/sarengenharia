<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>ClassificaTOR | São Paulo</title>

  <script src="/js/sar.page-guard.js?v=20261005-spdirect-v1"></script>
  <script src="/js/sar.api.js?v=20261005-spdirect-v1"></script>
  <script src="/game-classificator/assets/classificator-api.js?v=20261005-spdirect-v1"></script>

  <style>
    html,body{margin:0;min-height:100%;background:#f2fbf6}
    body{visibility:hidden}
  </style>
</head>
<body>
<script>
(()=>{
  "use strict";

  let launched=false;

  async function openClassificator(){
    if(launched) return;
    launched=true;

    try{
      const data=await window.SARClassificatorAPI.start();
      window.location.replace(data?.next || "/game-classificator/fase-01/");
    }catch(error){
      console.error("ClassificaTOR: falha ao iniciar",error);
      launched=false;
      document.body.style.visibility="visible";
      document.body.innerHTML=`
        <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Segoe UI,Arial,sans-serif;color:#173f38">
          <section style="max-width:520px;background:#fff;border:1px solid #cfe3d7;border-radius:12px;padding:24px;text-align:center">
            <strong>Não foi possível iniciar o ClassificaTOR.</strong>
            <p style="margin:10px 0 0;color:#60786f;font-size:14px">Atualize a página ou retorne ao portal SAR.</p>
          </section>
        </main>`;
    }
  }

  window.addEventListener("sar:pagina-autorizada",openClassificator,{once:true});

  function checkAuthorized(){
    const state=document.documentElement.getAttribute("data-sar-autorizado");
    if(state) openClassificator();
    else window.setTimeout(checkAuthorized,40);
  }

  checkAuthorized();
})();
</script>
</body>
</html>
