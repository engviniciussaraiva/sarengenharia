<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>ClassificaTOR | Ocupação</title>
  <script src="/js/sar.page-guard.js"></script><script src="/js/sar.api.js"></script><script src="/game-classificator/assets/classificator-api.js"></script>
  <link rel="stylesheet" href="/game-classificator/assets/classificator-shell.css">
  <style>
    .occupation-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px}.occupation-card{padding:18px;border:1px solid #cee1d6;border-radius:12px;background:#fff;color:#173f38;text-align:left;cursor:pointer;transition:.18s;min-height:98px}.occupation-card:hover{transform:translateY(-2px);border-color:#56aa80;box-shadow:0 8px 20px rgba(13,81,63,.09)}.occupation-code{display:block;margin-bottom:6px;color:#1b9a68;font-size:13px;font-weight:900;letter-spacing:.08em}.occupation-name{display:block;font-size:15px;font-weight:800;line-height:1.25}.occupation-card:disabled{opacity:.55;cursor:wait}.error{min-height:20px;margin-top:14px;color:#9f433b;text-align:center;font-size:13px}@media(max-width:1100px){.occupation-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.occupation-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.occupation-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div data-classificator-header data-stage="FASE_05"></div>
  <main class="page-shell"><header class="page-head"><div><p class="page-eyebrow">Ocupação</p><h1 class="page-title">Selecione o grupo de ocupação</h1><p class="page-subtitle">Escolha o grupo correspondente ao uso predominante da edificação.</p></div><div class="page-actions"><button class="ghost-btn" id="btnTrajeto" type="button">Escolher outro critério</button></div></header>
  <section class="workspace"><div class="occupation-grid" id="grid">
    <button class="occupation-card" data-opcao="OCUP_A"><span class="occupation-code">GRUPO A</span><span class="occupation-name">Residencial</span></button>
    <button class="occupation-card" data-opcao="OCUP_B"><span class="occupation-code">GRUPO B</span><span class="occupation-name">Serviço de hospedagem</span></button>
    <button class="occupation-card" data-opcao="OCUP_C"><span class="occupation-code">GRUPO C</span><span class="occupation-name">Comercial</span></button>
    <button class="occupation-card" data-opcao="OCUP_D"><span class="occupation-code">GRUPO D</span><span class="occupation-name">Serviço profissional</span></button>
    <button class="occupation-card" data-opcao="OCUP_E"><span class="occupation-code">GRUPO E</span><span class="occupation-name">Educacional e cultura física</span></button>
    <button class="occupation-card" data-opcao="OCUP_F"><span class="occupation-code">GRUPO F</span><span class="occupation-name">Local de reunião de público</span></button>
    <button class="occupation-card" data-opcao="OCUP_G"><span class="occupation-code">GRUPO G</span><span class="occupation-name">Serviços automotivos</span></button>
    <button class="occupation-card" data-opcao="OCUP_H"><span class="occupation-code">GRUPO H</span><span class="occupation-name">Serviço de saúde e institucional</span></button>
    <button class="occupation-card" data-opcao="OCUP_I"><span class="occupation-code">GRUPO I</span><span class="occupation-name">Indústria</span></button>
    <button class="occupation-card" data-opcao="OCUP_J"><span class="occupation-code">GRUPO J</span><span class="occupation-name">Depósito</span></button>
    <button class="occupation-card" data-opcao="OCUP_K"><span class="occupation-code">GRUPO K</span><span class="occupation-name">Energia</span></button>
    <button class="occupation-card" data-opcao="OCUP_L"><span class="occupation-code">GRUPO L</span><span class="occupation-name">Explosivos</span></button>
    <button class="occupation-card" data-opcao="OCUP_M"><span class="occupation-code">GRUPO M</span><span class="occupation-name">Especial</span></button>
  </div><div class="error" id="error"></div></section></main>
  <script src="/game-classificator/assets/classificator-shell.js"></script>
  <script>(()=>{"use strict";const cards=[...document.querySelectorAll(".occupation-card")],err=document.getElementById("error");document.getElementById("btnTrajeto").onclick=()=>location.assign("/game-classificator/fase-02/");const lock=v=>cards.forEach(c=>c.disabled=v);cards.forEach(c=>c.onclick=async()=>{lock(true);err.textContent="";try{const data=await SARClassificatorAPI.answer("FASE_05",c.dataset.opcao,null);if(!data?.ok)throw new Error("Não foi possível registrar a ocupação.");location.assign(data.next||"/game-classificator/fase-02/")}catch(e){err.textContent=e.message||"Não foi possível salvar.";lock(false)}})})();</script>
</body></html>
