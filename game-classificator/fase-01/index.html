<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>GAME ClassificaTOR | Fase 1</title>
  <script src="/js/sar.page-guard.js"></script>

  <style>
    :root{
      --sar:#315858;
      --sar-light:#7cb342;
      --ink:#263b3b;
      --muted:#6e7d7d;
      --line:#dfe6e3;
      --bg:#f4f7f5;
      --white:#ffffff;
      --warn:#fff4d6;
      --warn-ink:#8a6a12;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:var(--bg);
    }

    body{
      padding:18px;
    }

    button{
      font:inherit;
    }

    .shell{
      max-width:1500px;
      margin:0 auto;
    }

    .fase-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:18px;
    }

    .eyebrow{
      margin:0 0 4px;
      color:var(--sar-light);
      font-size:12px;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      color:var(--sar);
      font-size:26px;
      line-height:1.15;
    }

    .subtitle{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .fase-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .ghost-btn{
      min-width:130px;
      padding:10px 16px;
      border:1px solid #cfdad6;
      border-radius:8px;
      background:#fff;
      color:var(--sar);
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      transition:.18s;
    }

    .ghost-btn:hover{
      background:#f4f8f6;
      border-color:#9fb8ad;
    }

    .workspace{
      min-height:500px;
      padding:28px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      box-shadow:0 4px 16px rgba(31,65,57,.05);
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3, minmax(280px, 1fr));
      gap:24px;
      align-items:start;
    }

    .option-card{
      position:relative;
      border:1px solid #dce4e1;
      border-radius:12px;
      background:#fff;
      overflow:hidden;
      text-align:center;
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .option-card.active{
      cursor:pointer;
    }

    .option-card.active:hover{
      transform:translateY(-4px);
      border-color:#a7c3b2;
      box-shadow:0 8px 22px rgba(49,88,88,.12);
    }

    .option-card.disabled{
      opacity:.82;
      filter:saturate(.92);
      cursor:not-allowed;
    }

    .card-image{
      position:relative;
      width:100%;
      aspect-ratio:1.3 / 1;
      overflow:hidden;
      background:#edf2ef;
      border-bottom:1px solid #e7eeea;
    }

    .card-image img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .option-card.active:hover .card-image img{
      transform:scale(1.02);
      transition:transform .22s ease;
    }

    .card-body{
      padding:16px 14px 18px;
    }

    .card-title{
      margin:0;
      color:var(--sar);
      font-size:26px;
      font-weight:800;
      line-height:1.15;
      text-transform:uppercase;
    }

    .badge{
      position:absolute;
      top:12px;
      right:12px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      z-index:2;
    }

    .badge.active{
      background:#eef7e3;
      color:#5c7e22;
      border:1px solid #d6e9b2;
    }

    .badge.soon{
      background:var(--warn);
      color:var(--warn-ink);
      border:1px solid #ead58e;
    }

    .status{
      min-height:22px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media(max-width:1100px){
      .cards{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:760px){
      body{padding:10px}

      .fase-head{
        display:block;
      }

      .fase-actions{
        margin-top:14px;
      }

      .workspace{
        padding:18px;
      }

      h1{
        font-size:22px;
      }

      .card-title{
        font-size:22px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="fase-head">
      <div>
        <p class="eyebrow">Fase 1</p>
        <h1>Selecione a Configuração do Lote</h1>
        <p class="subtitle">Quantas edificações possui no lote?</p>
      </div>

      <div class="fase-actions">
        <button class="ghost-btn" id="btnInicio" type="button">Início</button>
        <button class="ghost-btn" id="btnVoltar" type="button">Voltar fase anterior</button>
      </div>
    </header>

    <section class="workspace">
      <div class="cards">

        <!-- CARD 1 - ATIVO -->
        <button
          class="option-card active"
          id="cardUmaEdificacao"
          type="button"
          aria-label="Selecionar lote com uma edificação"
        >
          <span class="badge active">Disponível</span>

          <div class="card-image">
            <img
              src="/game-classificator/assets/lote-uma-edificacao.png"
              alt="Lote com uma edificação"
              draggable="false"
            >
          </div>

          <div class="card-body">
            <h2 class="card-title">
              LOTE COM UMA<br>EDIFICAÇÃO
            </h2>
          </div>
        </button>

        <!-- CARD 2 - BLOQUEADO -->
        <div
          class="option-card disabled"
          aria-label="Lote com duas edificações em breve"
        >
          <span class="badge soon">Em breve</span>

          <div class="card-image">
            <img
              src="/game-classificator/assets/lote-duas-edificacoes.png"
              alt="Lote com duas edificações"
              draggable="false"
            >
          </div>

          <div class="card-body">
            <h2 class="card-title">
              LOTE COM DUAS<br>EDIFICAÇÕES
            </h2>
          </div>
        </div>

        <!-- CARD 3 - BLOQUEADO -->
        <div
          class="option-card disabled"
          aria-label="Lote com mais de duas edificações em breve"
        >
          <span class="badge soon">Em breve</span>

          <div class="card-image">
            <img
              src="/game-classificator/assets/lote-mais-de-duas-edificacoes.png"
              alt="Lote com mais de duas edificações"
              draggable="false"
            >
          </div>

          <div class="card-body">
            <h2 class="card-title">
              LOTE COM MAIS DE DUAS<br>EDIFICAÇÕES
            </h2>
          </div>
        </div>

      </div>

      <div class="status" id="statusFase" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const btnInicio = document.getElementById("btnInicio");
      const btnVoltar = document.getElementById("btnVoltar");
      const cardUmaEdificacao = document.getElementById("cardUmaEdificacao");
      const statusFase = document.getElementById("statusFase");

      function atualizarStatus(texto){
        if(statusFase){
          statusFase.textContent = texto || "";
        }
      }

      btnInicio?.addEventListener("click", () => {
        window.location.assign("/game-classificator/");
      });

      btnVoltar?.addEventListener("click", () => {
        window.location.assign("/game-classificator/");
      });

      cardUmaEdificacao?.addEventListener("click", () => {
        atualizarStatus("Opção selecionada. Preparando próxima fase...");
        console.log("GAME ClassificaTOR: caminho 'uma edificação' selecionado.");

        /*
          Próximo passo:
          aqui vamos conectar com a Vercel Function da Fase 1
          para registrar a escolha no motor escondido.
        */

        // Exemplo futuro:
        // window.location.assign("/game-classificator/fase-02/");
      });
    })();
  </script>
</body>
</html>
