<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>GAME ClassificaTOR | Fase 1</title>
  <script src="/js/sar.page-guard.js"></script>
  <link rel="stylesheet" href="/game-classificator/assets/classificator-shell.css">
  <style>
    .cards{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:24px;align-items:start}
    .option-card{position:relative;width:100%;padding:0;overflow:hidden;border:1px solid #dce4e1;border-radius:12px;background:#fff;text-align:center;transition:.18s}
    .option-card.active{cursor:pointer}.option-card.active:hover{transform:translateY(-4px);border-color:#a7c3b2;box-shadow:0 8px 22px rgba(49,88,88,.12)}
    .option-card.active:focus-visible{outline:3px solid rgba(124,179,66,.35);outline-offset:3px}.option-card.disabled{opacity:.72;filter:saturate(.82);cursor:not-allowed}
    .card-image{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#edf2ef;border-bottom:1px solid #e7eeea}.card-image img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}
    .card-body{min-height:90px;display:flex;align-items:center;justify-content:center;padding:14px 19px}.card-title{margin:0;color:#315858;font-size:20px;font-weight:800;line-height:1.18;text-transform:uppercase;text-align:center}
    .badge{position:absolute;top:12px;right:12px;z-index:2;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .badge.active{background:#eef7e3;color:#5c7e22;border:1px solid #d6e9b2}.badge.soon{background:#fff4d6;color:#8a6a12;border:1px solid #ead58e}
    @media(max-width:960px){.cards{grid-template-columns:1fr}.option-card{max-width:620px;margin:0 auto}}
  </style>
</head>
<body>
  <div data-classificator-header data-stage="FASE_01"></div>

  <main class="page-shell">
    <header class="page-head">
      <div>
        <p class="page-eyebrow">Fase 1 — Implantação</p>
        <h1 class="page-title">Selecione a configuração da implantação</h1>
        <p class="page-subtitle">Quantas edificações possui no lote?</p>
      </div>
      <div class="page-actions">
        <button class="ghost-btn" id="btnInicio" type="button">Início</button>
      </div>
    </header>

    <section class="workspace">
      <div class="cards">
        <button class="option-card active" id="cardUmaEdificacao" type="button" aria-label="Selecionar lote com uma edificação">
          <span class="badge active">Disponível</span>
          <div class="card-image"><img src="/game-classificator/assets/lote-uma-edificacao.png" alt="Lote com uma edificação" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">LOTE COM UMA<br>EDIFICAÇÃO</h2></div>
        </button>

        <div class="option-card disabled" aria-label="Lote com duas edificações - em breve">
          <span class="badge soon">Em breve</span>
          <div class="card-image"><img src="/game-classificator/assets/lote-duas-edificacoes.png" alt="Lote com duas edificações" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">LOTE COM DUAS<br>EDIFICAÇÕES</h2></div>
        </div>

        <div class="option-card disabled" aria-label="Lote com mais de duas edificações - em breve">
          <span class="badge soon">Em breve</span>
          <div class="card-image"><img src="/game-classificator/assets/lote-mais-de-duas-edificacoes.png" alt="Lote com mais de duas edificações" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">LOTE COM MAIS DE DUAS<br>EDIFICAÇÕES</h2></div>
        </div>
      </div>
      <div class="status" id="statusFase" aria-live="polite"></div>
    </section>
  </main>

  <script src="/game-classificator/assets/classificator-shell.js"></script>
  <script>
    (() => {
      "use strict";
      const card=document.getElementById("cardUmaEdificacao");
      const status=document.getElementById("statusFase");
      document.getElementById("btnInicio")?.addEventListener("click",()=>window.location.assign("/game-classificator/fase-01/"));

      async function escrever(texto){
        status.textContent="";status.classList.add("escrevendo");
        for(let i=0;i<texto.length;i++){status.textContent+=texto.charAt(i);await new Promise(r=>setTimeout(r,18));}
        status.classList.remove("escrevendo");
      }

      card?.addEventListener("click",async()=>{
        if(card.disabled)return;
        card.disabled=true;status.textContent="Registrando implantação...";
        try{
          const response=await fetch("/api/game/classificator/responder",{
            method:"POST",credentials:"same-origin",
            headers:{"Content-Type":"application/json",Accept:"application/json","X-Requested-With":"SAR-ClassificaTOR"},
            body:JSON.stringify({fase:"fase-01",opcao:"LOTE_UMA_EDIFICACAO"})
          });
          const data=await response.json().catch(()=>null);
          if(!response.ok||!data?.ok)throw new Error(response.status===401?"Sua sessão expirou. Reinicie o ClassificaTOR.":"Não foi possível registrar a implantação.");
          if(data.classificacao)window.SARClassificatorUI?.updateClassification(data.classificacao);
          await escrever(data.mensagem||"Implantação registrada.");
          if(data.next){await new Promise(r=>setTimeout(r,260));window.location.assign(data.next);return;}
          card.disabled=false;
        }catch(err){console.error(err);status.classList.remove("escrevendo");status.textContent=err.message||"Não foi possível continuar.";card.disabled=false;}
      });
    })();
  </script>
</body>
</html>
