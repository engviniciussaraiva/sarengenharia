<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sar-recurso-codigo" content="GAME_CLASSIFICATOR">
  <title>GAME ClassificaTOR | Fase 3</title>
  <script src="/js/sar.page-guard.js"></script>
  <link rel="stylesheet" href="/game-classificator/assets/classificator-shell.css">
  <style>
    .area-info{display:flex;align-items:center;gap:10px;margin:0 0 18px auto;max-width:570px;padding:12px 15px;border:1px solid #cfe9dc;border-radius:10px;background:#effaf4;color:#315858;font-size:13px;line-height:1.35}.area-info strong{display:flex;align-items:center;justify-content:center;width:25px;height:25px;border:2px solid #2a9d68;border-radius:50%;color:#2a9d68;font-size:15px;flex:0 0 auto}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:20px;align-items:stretch}
    .option-card{width:100%;padding:0;overflow:hidden;border:1px solid #dce4e1;border-radius:14px;background:#fff;text-align:center;cursor:pointer;transition:.18s;box-shadow:0 2px 8px rgba(31,65,57,.03)}
    .option-card:hover{transform:translateY(-4px);box-shadow:0 9px 24px rgba(49,88,88,.13)}.option-card:focus-visible{outline:3px solid rgba(124,179,66,.35);outline-offset:3px}.option-card:disabled{opacity:.58;cursor:wait;transform:none}
    .option-card.green{border-color:#8bc9a4;background:linear-gradient(#f7fffa,#effaf4)}.option-card.blue{border-color:#91b8eb;background:linear-gradient(#fbfdff,#eff6ff)}.option-card.purple{border-color:#bea3d5;background:linear-gradient(#fffaff,#f7f0fb)}
    .card-image{height:250px;overflow:hidden;border-bottom:1px solid rgba(80,110,100,.12);background:#f4f7f5}.card-image img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;pointer-events:none;transition:.22s}.option-card:hover .card-image img{transform:scale(1.02)}
    .card-body{min-height:125px;padding:18px 16px;display:flex;align-items:center;justify-content:center}.card-title{margin:0;font-size:20px;line-height:1.2;font-weight:800;color:#244b48}.green .card-title strong{color:#21764e}.blue .card-title strong{color:#1c61a9}.purple .card-title strong{color:#713b91}
    @media(max-width:980px){.cards{grid-template-columns:1fr}.option-card{max-width:720px;margin:0 auto}.card-image{height:300px}.area-info{margin-left:0}}
  </style>
</head>
<body>
  <div data-classificator-header data-phase="3" data-phase-label="3"></div>

  <main class="page-shell">
    <header class="page-head">
      <div>
        <p class="page-eyebrow">Fase 3</p>
        <h1 class="page-title">Qual a área total construída da edificação?</h1>
        <p class="page-subtitle">Selecione a faixa correspondente à área total construída considerada para a classificação.</p>
      </div>
      <div class="page-actions">
        <button class="ghost-btn" id="btnInicio" type="button">Início</button>
        <button class="ghost-btn" id="btnVoltar" type="button">Voltar fase anterior</button>
      </div>
    </header>

    <section class="workspace">
      <div class="area-info"><strong>i</strong><span>Considere a <b>área total construída</b> da edificação. As exclusões normativas aplicáveis serão tratadas pelo motor nas etapas correspondentes.</span></div>

      <div class="cards">
        <button class="option-card green" type="button" data-opcao="AREA_ATE_750">
          <div class="card-image"><img src="/game-classificator/assets/area-ate-750.png" alt="Representação de área total construída até 750 metros quadrados" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">Área total construída<br><strong>até 750,00 m²</strong></h2></div>
        </button>

        <button class="option-card blue" type="button" data-opcao="AREA_750_1500">
          <div class="card-image"><img src="/game-classificator/assets/area-750-1500.png" alt="Representação de área total construída entre 750,01 e 1500 metros quadrados" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">Área total construída<br><strong>entre 750,01 m² e 1.500,00 m²</strong></h2></div>
        </button>

        <button class="option-card purple" type="button" data-opcao="AREA_ACIMA_1500">
          <div class="card-image"><img src="/game-classificator/assets/area-acima-1500.png" alt="Representação de área total construída acima de 1500 metros quadrados" draggable="false"></div>
          <div class="card-body"><h2 class="card-title">Área total construída<br><strong>acima de 1.500,00 m²</strong></h2></div>
        </button>
      </div>
      <div class="status" id="statusFase" aria-live="polite"></div>
    </section>
  </main>

  <script src="/game-classificator/assets/classificator-shell.js"></script>
  <script>
    (()=>{
      "use strict";
      const cards=[...document.querySelectorAll(".option-card[data-opcao]")],status=document.getElementById("statusFase");
      document.getElementById("btnInicio")?.addEventListener("click",()=>window.location.assign("/game-classificator/fase-01/"));
      document.getElementById("btnVoltar")?.addEventListener("click",()=>{if(history.length>1)history.back();else window.location.assign("/game-classificator/fase-02/")});
      const travar=v=>cards.forEach(c=>c.disabled=v);
      async function escrever(texto){status.textContent="";status.classList.add("escrevendo");for(let i=0;i<texto.length;i++){status.textContent+=texto.charAt(i);await new Promise(r=>setTimeout(r,18));}status.classList.remove("escrevendo")}
      async function responder(card){
        const opcao=String(card.dataset.opcao||"").trim();if(!opcao)return;travar(true);status.textContent="Analisando área total construída...";
        try{
          const response=await fetch("/api/game/classificator/responder",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",Accept:"application/json","X-Requested-With":"SAR-ClassificaTOR"},body:JSON.stringify({fase:"fase-03",opcao})});
          const data=await response.json().catch(()=>null);
          if(!response.ok||!data?.ok)throw new Error(response.status===401?"Sua sessão expirou. Volte à Fase 1.":"Não foi possível registrar a área.");
          if(data.classificacao)window.SARClassificatorUI?.updateClassification(data.classificacao);
          await escrever(data.mensagem||"Área registrada. A classificação provisória foi atualizada.");
          if(data.next){await new Promise(r=>setTimeout(r,350));window.location.assign(data.next);return;}
          travar(false);
        }catch(err){console.error(err);status.classList.remove("escrevendo");status.textContent=err.message||"Não foi possível continuar. Tente novamente.";travar(false)}
      }
      cards.forEach(c=>c.addEventListener("click",()=>responder(c)));
    })();
  </script>
</body>
</html>
