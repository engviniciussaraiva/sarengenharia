<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automação DXF/CAD | SAR Engenharia</title>

  <!--
    Módulo independente do SAR.
    Esta V1 não altera outros módulos e não chama Railway.
    Estrutura pronta para receber os endpoints futuramente.
  -->

  <link rel="stylesheet" href="./css/automacao-dxf-cad.css">
</head>
<body>

  <main class="sar-dxf-page">

    <!-- Menu superior interno do módulo -->
    <nav class="sar-dxf-tabs" aria-label="Automações DXF/CAD">
      <button class="sar-dxf-tab" data-page="croqui">Croqui → DXF</button>
      <button class="sar-dxf-tab" data-page="pdf">PDF → DXF</button>
      <button class="sar-dxf-tab" data-page="imagem">Imagem → DXF</button>
      <button class="sar-dxf-tab" data-page="coordenadas">Coordenadas → DXF</button>
      <button class="sar-dxf-tab" data-page="outras">Outras Automações</button>
    </nav>

    <!-- Conteúdo dinâmico do módulo -->
    <section id="sarDxfContent" class="sar-dxf-content" aria-live="polite"></section>

  </main>

  <script src="./js/automacao-dxf-cad.js"></script>
</body>
</html>
