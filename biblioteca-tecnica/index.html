<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Biblioteca Técnica | SAR Engenharia</title>

  <style>
    :root {
      --verde-escuro: #123b32;
      --verde-principal: #1f6b57;
      --verde-hover: #e9f5f0;
      --verde-claro: #dcefe8;
      --fundo: #f5f7f6;
      --branco: #ffffff;
      --texto: #26332f;
      --texto-suave: #65736e;
      --borda: #d8e0dd;
      --sombra: 0 3px 14px rgba(20, 58, 49, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      color: var(--texto);
      background: var(--fundo);
    }

    body {
      padding: 24px;
    }

    .pagina {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .cabecalho {
      margin-bottom: 20px;
    }

    .titulo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--verde-escuro);
      font-size: 27px;
      font-weight: 700;
    }

    .subtitulo {
      margin: 8px 0 0;
      color: var(--texto-suave);
      font-size: 14px;
      line-height: 1.5;
    }

    .biblioteca {
      overflow: hidden;
      min-height: 620px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      background: var(--branco);
      box-shadow: var(--sombra);
    }

    .abas {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      overflow-x: auto;
      padding: 14px 14px 0;
      border-bottom: 1px solid var(--borda);
      background: #f8faf9;
    }

    .aba {
      position: relative;
      min-width: max-content;
      padding: 13px 20px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--texto-suave);
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .aba:hover {
      color: var(--verde-principal);
      background: var(--verde-hover);
    }

    .aba.ativa {
      margin-bottom: -1px;
      border-color: var(--borda);
      border-bottom: 1px solid var(--branco);
      color: var(--verde-escuro);
      background: var(--branco);
    }

    .aba.ativa::after {
      position: absolute;
      top: 0;
      right: 12px;
      left: 12px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--verde-principal);
      content: "";
    }

    .conteudo {
      min-height: 560px;
      background: var(--branco);
    }

    .painel {
      display: none;
      min-height: 560px;
    }

    .painel.ativo {
      display: block;
    }

    .barra-painel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--borda);
      background: var(--branco);
    }

    .painel-titulo {
      margin: 0;
      color: var(--verde-escuro);
      font-size: 16px;
      font-weight: 700;
    }

    .abrir-pagina {
      padding: 8px 13px;
      border: 1px solid var(--verde-principal);
      border-radius: 7px;
      color: var(--verde-principal);
      background: var(--branco);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .abrir-pagina:hover {
      color: var(--branco);
      background: var(--verde-principal);
    }

    .quadro {
      display: block;
      width: 100%;
      min-height: 505px;
      border: 0;
      background: var(--branco);
    }

    .aviso {
      display: none;
      margin: 20px;
      padding: 14px 16px;
      border: 1px solid #e6d7a3;
      border-radius: 8px;
      color: #675411;
      background: #fff9e6;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .titulo {
        font-size: 22px;
      }

      .abas {
        padding-right: 8px;
        padding-left: 8px;
      }

      .aba {
        padding: 12px 14px;
      }

      .barra-painel {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <header class="cabecalho">
      <h1 class="titulo">
        <span aria-hidden="true">📚</span>
        Biblioteca Técnica
      </h1>

      <p class="subtitulo">
        Consulte as bases técnicas utilizadas pelos módulos do SAR.
      </p>
    </header>

    <section class="biblioteca">

      <nav class="abas" aria-label="Bibliotecas técnicas">

        <button
          class="aba ativa"
          type="button"
          data-aba="tubulacoes"
          aria-selected="true"
        >
          Tubulações
        </button>

        <button
          class="aba"
          type="button"
          data-aba="produtos"
          aria-selected="false"
        >
          Produtos Igníferos
        </button>

        <button
          class="aba"
          type="button"
          data-aba="perdas"
          aria-selected="false"
        >
          Perdas Localizadas
        </button>

      </nav>

      <div class="conteudo">

        <!-- ABA TUBULAÇÕES -->
        <section
          id="painel-tubulacoes"
          class="painel ativo"
        >
          <div class="barra-painel">
            <h2 class="painel-titulo">
              Biblioteca de Tubulações
            </h2>

            <a
              id="link-tubulacoes"
              class="abrir-pagina"
              href="/hidraulica/tubos/"
            >
              Abrir página completa
            </a>
          </div>

          <iframe
            id="frame-tubulacoes"
            class="quadro"
            title="Biblioteca de tubulações"
            src="/hidraulica/tubos/"
            loading="eager"
          ></iframe>
        </section>

        <!-- ABA PRODUTOS -->
        <section
          id="painel-produtos"
          class="painel"
        >
          <div class="barra-painel">
            <h2 class="painel-titulo">
              Produtos Igníferos
            </h2>

            <a
              class="abrir-pagina"
              href="/modulos-incendio/produtos-igniferos/cadastro/"
            >
              Abrir página completa
            </a>
          </div>

          <iframe
            id="frame-produtos"
            class="quadro"
            title="Cadastro e consulta de produtos igníferos"
            data-src="/modulos-incendio/produtos-igniferos/cadastro/"
            loading="lazy"
          ></iframe>
        </section>

        <!-- ABA PERDAS LOCALIZADAS -->
        <section
          id="painel-perdas"
          class="painel"
        >
          <div class="barra-painel">
            <h2 class="painel-titulo">
              Perdas de Carga Localizadas
            </h2>

            <a
              id="link-perdas"
              class="abrir-pagina"
              href="/hidraulica/perdas-localizadas/"
            >
              Abrir página completa
            </a>
          </div>

          <iframe
            id="frame-perdas"
            class="quadro"
            title="Perdas de carga localizadas"
            data-src="/hidraulica/perdas-localizadas/"
            loading="lazy"
          ></iframe>
        </section>

      </div>
    </section>
  </main>

  <script>
    const abas = document.querySelectorAll(".aba");
    const paineis = document.querySelectorAll(".painel");

    function abrirAba(nomeAba) {
      abas.forEach((aba) => {
        const ativa = aba.dataset.aba === nomeAba;

        aba.classList.toggle("ativa", ativa);
        aba.setAttribute(
          "aria-selected",
          ativa ? "true" : "false"
        );
      });

      paineis.forEach((painel) => {
        painel.classList.toggle(
          "ativo",
          painel.id === `painel-${nomeAba}`
        );
      });

      const frame = document.querySelector(
        `#painel-${nomeAba} iframe`
      );

      if (
        frame &&
        !frame.getAttribute("src") &&
        frame.dataset.src
      ) {
        frame.src = frame.dataset.src;
      }

      history.replaceState(
        null,
        "",
        `#${nomeAba}`
      );
    }

    abas.forEach((aba) => {
      aba.addEventListener("click", () => {
        abrirAba(aba.dataset.aba);
      });
    });

    const abaInicial =
      window.location.hash.replace("#", "");

    if (
      ["tubulacoes", "produtos", "perdas"]
        .includes(abaInicial)
    ) {
      abrirAba(abaInicial);
    }
  </script>
</body>
</html>
