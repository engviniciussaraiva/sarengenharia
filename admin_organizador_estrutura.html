<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR | Organizador da Estrutura</title>
<style>
:root{--sar:#315858;--verde:#7cb342;--fundo:#f5f6f8;--linha:#dfe4e4;--texto:#374343;--muted:#718080;--erro:#b83232;--erro-bg:#fff0f0;--sucesso:#16834b;--sucesso-bg:#e9f7ef}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:24px;background:var(--fundo);color:var(--texto);font-family:Segoe UI,Arial,sans-serif}.pagina{width:min(1180px,100%);margin:auto}.cabecalho{display:flex;justify-content:space-between;gap:18px;margin-bottom:18px}h1{color:var(--sar);font-size:28px}.subtitulo{margin-top:6px;color:var(--muted);line-height:1.5;font-size:14px}.acoes{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:40px;padding:0 14px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--texto);font-weight:700;cursor:pointer}.btn.primary{background:var(--sar);border-color:var(--sar);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.aviso,.estado{margin-bottom:16px;padding:14px 16px;border:1px solid var(--linha);border-radius:10px;background:#fff;line-height:1.55}.estado{display:none}.estado.visivel{display:block}.estado.erro{color:var(--erro);background:var(--erro-bg);border-color:#efcaca}.estado.sucesso{color:var(--sucesso);background:var(--sucesso-bg);border-color:#c8ead7}.arvore{display:grid;gap:12px}.item{position:relative;display:grid;grid-template-columns:minmax(250px,1fr) 260px 105px auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--linha);border-radius:10px;background:#fff}.item.nivel-1{margin-left:28px;background:#fbfcfc}.item.nivel-2{margin-left:56px}.item.nivel-1:before,.item.nivel-2:before{content:"";position:absolute;left:-17px;top:-13px;width:14px;height:35px;border-left:1px solid #cfd8d8;border-bottom:1px solid #cfd8d8;border-bottom-left-radius:6px}.identidade{display:flex;gap:10px;min-width:0}.icone{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#eef4f3;font-size:19px}.identidade strong{display:block;color:var(--sar);font-size:14px}.identidade small{display:block;margin-top:3px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.nivel{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:999px;background:#edf2f2;color:#536363;font-size:10px;font-weight:800;text-transform:uppercase}select,input{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--linha);border-radius:7px;background:#fff;color:var(--texto);font:inherit}.ordem-controles{display:flex;gap:6px}.mini{width:36px;height:36px;border:1px solid var(--linha);border-radius:7px;background:#fff;cursor:pointer;font-weight:800}.mini:hover{background:#f0f4f4}@media(max-width:900px){.item{grid-template-columns:1fr}.item.nivel-1{margin-left:18px}.item.nivel-2{margin-left:36px}.cabecalho{flex-direction:column}}
</style>
</head>
<body>
<main class="pagina">
<header class="cabecalho"><div><h1>Organizador Visual da Estrutura</h1><p class="subtitulo">Reorganize o SAR mantendo exatamente Módulo → Aba → Subaba.</p></div><div class="acoes"><button id="btnAtualizar" class="btn">Atualizar</button><button id="btnSalvar" class="btn primary">Salvar alterações</button></div></header>
<div class="aviso">Use <b>↑</b> e <b>↓</b> para alterar a ordem entre itens do mesmo grupo. Para mudar um item de nível, altere <b>Pertence a</b>. O sistema bloqueia ciclos e níveis além de subaba.</div>
<div id="estado" class="estado"></div><section id="arvore" class="arvore"><div class="aviso">Carregando estrutura...</div></section>
</main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://bjtxbpmrmhfvpmdsthxr.supabase.co","sb_publishable_E1Oxs2VdHcNrVbb7yIGnsg_zd6EYMvM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let modulos=[],alterados=new Set();const arvore=document.getElementById("arvore"),estado=document.getElementById("estado"),btnAtualizar=document.getElementById("btnAtualizar"),btnSalvar=document.getElementById("btnSalvar");
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function msg(t,c=""){estado.textContent=t;estado.className=`estado visivel ${c}`.trim()}function limparMsg(){estado.className="estado"}
function icone(v){const o=String(v||"").trim(),m={brain:"🧠",clipboard:"📋",repeat:"🔁",droplet:"💧",calculator:"🧮",settings:"⚙️",printer:"🖨️",cube:"🧊",building:"🏢",fire:"🔥",home:"🏠",project:"📐",book:"📚",database:"🗄️",users:"👥"};if(!o)return"🧩";const k=o.toLowerCase();if(m[k])return m[k];return/^[a-z0-9_-]+$/i.test(o)?"🧩":o}
const ordem=(a,b)=>Number(a.ordem_menu||0)-Number(b.ordem_menu||0)||String(a.modulo||"").localeCompare(String(b.modulo||""),"pt-BR");
function mapa(){return new Map(modulos.map(x=>[x.id,x]))}function nivel(item){const mp=mapa();let n=0,a=item,v=new Set();while(a?.modulo_pai&&n<10){if(v.has(a.id))return 99;v.add(a.id);a=mp.get(a.modulo_pai);n++}return n}
function estrutura(){const f=new Map();modulos.forEach(x=>{const k=x.modulo_pai||"RAIZ";if(!f.has(k))f.set(k,[]);f.get(k).push(x)});f.forEach(l=>l.sort(ordem));const r=[];function vis(p,n){(f.get(p)||[]).forEach(x=>{r.push({x,n});vis(x.id,n+1)})}vis("RAIZ",0);return r}
function opcoes(item){const desc=new Set();function col(id){modulos.filter(x=>x.modulo_pai===id).forEach(f=>{desc.add(f.id);col(f.id)})}col(item.id);return`<option value="">Nenhum — módulo principal</option>`+modulos.filter(c=>c.id!==item.id&&!desc.has(c.id)&&nivel(c)<=1).sort((a,b)=>nivel(a)-nivel(b)||ordem(a,b)).map(c=>`<option value="${c.id}" ${item.modulo_pai===c.id?"selected":""}>${nivel(c)===0?"Módulo":"Aba"}: ${esc(c.modulo||c.codigo)}</option>`).join("")}
function render(){const e=estrutura();if(!e.length){arvore.innerHTML='<div class="aviso">Nenhum módulo cadastrado.</div>';return}arvore.innerHTML=e.map(({x,n})=>`<article class="item nivel-${Math.min(n,2)}" data-id="${x.id}"><div class="identidade"><span class="icone">${esc(icone(x.icone))}</span><div><strong>${esc(x.modulo||"Sem nome")}</strong><small>${esc(x.codigo||"")}</small><span class="nivel">${n===0?"Módulo":n===1?"Aba":"Subaba"}</span></div></div><select data-pai="${x.id}">${opcoes(x)}</select><input data-ordem="${x.id}" type="number" step="1" value="${Number(x.ordem_menu||0)}"><div class="ordem-controles"><button class="mini" data-subir="${x.id}">↑</button><button class="mini" data-descer="${x.id}">↓</button></div></article>`).join("");
arvore.querySelectorAll("[data-pai]").forEach(s=>s.onchange=()=>{const x=modulos.find(m=>m.id===s.dataset.pai);x.modulo_pai=s.value||null;alterados.add(x.id);normalizar(x.modulo_pai);render()});arvore.querySelectorAll("[data-ordem]").forEach(i=>i.onchange=()=>{const x=modulos.find(m=>m.id===i.dataset.ordem);x.ordem_menu=Number(i.value||0);x.ordem=x.ordem_menu;alterados.add(x.id);render()});arvore.querySelectorAll("[data-subir]").forEach(b=>b.onclick=()=>mover(b.dataset.subir,-1));arvore.querySelectorAll("[data-descer]").forEach(b=>b.onclick=()=>mover(b.dataset.descer,1))}
function irmaos(x){return modulos.filter(m=>(m.modulo_pai||null)===(x.modulo_pai||null)).sort(ordem)}function normalizar(p){modulos.filter(m=>(m.modulo_pai||null)===(p||null)).sort(ordem).forEach((x,i)=>{x.ordem_menu=(i+1)*10;x.ordem=x.ordem_menu;alterados.add(x.id)})}function mover(id,d){const x=modulos.find(m=>m.id===id),l=irmaos(x),i=l.findIndex(m=>m.id===id),j=i+d;if(j<0||j>=l.length)return;const y=l[j],o=Number(x.ordem_menu||0);x.ordem_menu=Number(y.ordem_menu||0);y.ordem_menu=o;x.ordem=x.ordem_menu;y.ordem=y.ordem_menu;alterados.add(x.id);alterados.add(y.id);render()}
async function sessao(){const{data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session?.user){window.top.location.replace("acesso.html");return false}return true}
async function carregar(){btnAtualizar.disabled=true;msg("Carregando estrutura...");try{if(!await sessao())return;const{data,error}=await supabase.rpc("sar_admin_listar_modulos");if(error)throw error;modulos=data||[];alterados.clear();render();limparMsg()}catch(e){arvore.innerHTML='<div class="aviso">Não foi possível carregar a estrutura.</div>';msg(e.message||String(e),"erro")}finally{btnAtualizar.disabled=false}}
async function salvar(){if(!alterados.size){msg("Nenhuma alteração pendente.","sucesso");return}btnSalvar.disabled=btnAtualizar.disabled=true;msg(`Salvando ${alterados.size} alteração(ões)...`);try{for(const id of alterados){const x=modulos.find(m=>m.id===id),{error}=await supabase.rpc("sar_admin_reorganizar_modulo",{p_id:x.id,p_modulo_pai:x.modulo_pai||null,p_ordem_menu:Number(x.ordem_menu||0)});if(error)throw new Error(`${x.modulo||x.codigo}: ${error.message}`)}alterados.clear();await carregar();msg("Estrutura salva com sucesso. Recarregue o sistema para conferir o menu.","sucesso")}catch(e){msg(e.message||String(e),"erro")}finally{btnSalvar.disabled=btnAtualizar.disabled=false}}
btnAtualizar.onclick=carregar;btnSalvar.onclick=salvar;carregar();
</script>
</body>
</html>
