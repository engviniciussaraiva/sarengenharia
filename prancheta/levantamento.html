<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="sar-recurso-codigo" content="PRANCHETA_LEVANTAMENTO">
  <title>Prancheta | SAR</title><script src="/js/sar.page-guard.js"></script>
  <style>
    :root{--sar:#315858;--light:#7cb342;--ink:#263b3b;--muted:#6e7d7d;--line:#dfe6e3;--bg:#f4f7f5;--red:#a34141}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}body{padding:18px}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}.eyebrow{margin:0 0 4px;color:var(--light);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;color:var(--sar);font-size:26px}.subtitle{margin:5px 0;color:var(--muted);font-size:14px}.state{padding:8px 12px;border:1px solid #d7e2dc;border-radius:8px;background:#fff;color:var(--muted);font-size:13px;height:max-content}.strip{display:flex;gap:10px;padding:12px;margin-bottom:18px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 16px #1f41390f}.tab{position:relative;min-width:112px;height:92px;padding:10px 8px;border:1px solid #dce4e1;border-radius:9px;background:#fff;color:#526666;cursor:pointer;transition:.18s}.tab:hover{transform:translateY(-2px);border-color:#a7c3b2}.tab.active{border-color:var(--sar);background:var(--sar);color:#fff;box-shadow:0 5px 14px #31585833}.dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#c8d0cd}.tab.active .dot{background:#b8e986}.ico{display:block;margin-bottom:7px;font-size:27px}.label{display:block;font-size:12px;font-weight:700;line-height:1.15}.workspace{min-height:500px;padding:28px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 16px #1f41390d}.workspace.draw{padding:10px}.empty{max-width:760px;margin:50px auto;text-align:center}.mark{width:74px;height:74px;display:grid;place-items:center;margin:0 auto 18px;border-radius:20px;background:#edf5ed;font-size:34px}.empty h2{margin:0 0 9px;color:var(--sar)}.empty p{color:var(--muted);line-height:1.55}.primary{padding:11px 18px;border:0;border-radius:8px;background:var(--sar);color:#fff;font-weight:700;cursor:pointer}
    .app{display:grid;grid-template-columns:76px minmax(520px,1fr) 270px;height:680px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tools{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 7px;background:var(--sar)}.tool{width:52px;min-height:48px;padding:4px;border:1px solid #ffffff33;border-radius:8px;background:#ffffff14;color:#fff;cursor:pointer}.tool.active{background:#fff;color:var(--sar);border-color:#b8e986}.tool b{display:block;font-size:19px}.tool small{font-size:8px;font-weight:700}.sep{width:38px;border-top:1px solid #ffffff33}.center{display:flex;flex-direction:column;min-width:0}.bar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:#fff;overflow:auto}.action{padding:7px 9px;border:1px solid #d7e2dc;border-radius:7px;background:#fff;color:var(--sar);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.action:hover{background:#f4f8f5}.action.danger{color:var(--red)}.zoom{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.stage{position:relative;flex:1;overflow:hidden;background:#fff}.stage.grid{background-image:linear-gradient(#dfe8e3 1px,transparent 1px),linear-gradient(90deg,#dfe8e3 1px,transparent 1px),linear-gradient(#c7d6cf 1px,transparent 1px),linear-gradient(90deg,#c7d6cf 1px,transparent 1px);background-size:10px 10px,10px 10px,50px 50px,50px 50px}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:12px;bottom:12px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#ffffffee;color:var(--muted);font-size:11px;pointer-events:none}.side{padding:14px;overflow:auto;border-left:1px solid var(--line);background:#fff}.side h2{margin:0 0 12px;color:var(--sar);font-size:15px}.block{margin-bottom:11px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#f8faf9}.block h3{margin:0 0 8px;color:var(--sar);font-size:12px}.field{display:grid;gap:4px;margin:7px 0}.field label{font-size:10px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:7px;border:1px solid #d6e0dc;border-radius:6px;background:#fff;color:var(--ink);font-size:12px}.row{display:flex;gap:5px}.chip{flex:1;padding:6px 3px;border:1px solid #d5dfdb;border-radius:6px;background:#fff;color:var(--sar);font-size:10px;font-weight:700;cursor:pointer}.chip.active{background:var(--sar);color:#fff}.side-actions{display:flex;flex-wrap:wrap;gap:5px}.mini{padding:6px 8px;border:1px solid #d5dfdb;border-radius:6px;background:#fff;color:var(--sar);font-size:10px;font-weight:700;cursor:pointer}.mini.red{color:var(--red)}.library{display:grid;grid-template-columns:1fr 1fr;gap:6px}.symbol{padding:8px 4px;border:1px solid #d5dfdb;border-radius:7px;background:#fff;color:var(--sar);font-size:10px;font-weight:700;cursor:pointer}.symbol b{display:block;font-size:20px}.status{padding:5px 8px;background:#edf5ed;color:var(--sar);border-radius:6px;font-size:11px}.hidden{display:none!important}
    .modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#10222288}.dialog{width:min(380px,100%);padding:20px;border-radius:12px;background:#fff;box-shadow:0 20px 60px #0004}.dialog h2{margin:0 0 14px;color:var(--sar);font-size:19px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:360px;padding:12px 15px;border-radius:8px;background:var(--sar);color:#fff;font-size:13px;box-shadow:0 8px 30px #0003}.file{display:none}@media(max-width:1000px){.app{grid-template-columns:70px minmax(430px,1fr)}.side{display:none}}@media(max-width:760px){body{padding:8px}.head{display:block}.state{display:inline-block;margin-top:8px}.workspace{padding:10px}.app{grid-template-columns:60px minmax(360px,1fr)}.tab{min-width:100px;height:86px}}
  </style>

<body><main class="shell"><header class="head"><div><p class="eyebrow">Central de desenvolvimento</p><h1>Prancheta</h1><p class="subtitle">Levantamento arquitetônico e exportação técnica para DXF.</p></div><div class="state" id="projectState">Desenho não salvo</div></header>
  <nav class="strip" aria-label="Ferramentas da Prancheta">
    <button class="tab active" data-view="visao"><i class="dot"></i><span class="ico">▦</span><span class="label">Visão Geral</span></button>
    <button class="tab" data-view="desenho"><i class="dot"></i><span class="ico">📐</span><span class="label">Desenho</span></button>
    <button class="tab" data-view="arquitetura"><i class="dot"></i><span class="ico">🏠</span><span class="label">Arquitetura</span></button>
    <button class="tab" data-view="incendio"><i class="dot"></i><span class="ico">🔥</span><span class="label">Símbolos de Incêndio</span></button>
    <button class="tab" data-view="camadas"><i class="dot"></i><span class="ico">▱</span><span class="label">Camadas</span></button>
    <button class="tab" data-view="propriedades"><i class="dot"></i><span class="ico">⚙️</span><span class="label">Propriedades</span></button>
    <button class="tab" data-view="importar"><i class="dot"></i><span class="ico">📥</span><span class="label">Importar</span></button>
    <button class="tab" data-view="exportar"><i class="dot"></i><span class="ico">📤</span><span class="label">Exportar</span></button>
  </nav><section id="workspace" class="workspace"></section></main>
  <input id="fileInput" class="file" type="file" accept=".json,application/json">
  <div id="modal" class="modal hidden"><form id="modalForm" class="dialog"><h2 id="modalTitle">Configuração</h2><div id="modalFields"></div><div class="dialog-actions"><button class="action" type="button" id="modalCancel">Cancelar</button><button class="primary" type="submit">Inserir</button></div></form></div><div id="toast" class="toast hidden"></div>
<script>
const SCALE=100,GRID=10;let view='visao',tool='select',zoom=1,grid=true,snap=true,wallWidth=.15,items=[],selected=null,history=[],future=[],draft=null,modalResolve=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`;const round=n=>Math.round(n*100)/100;
function overview(){return `<div class="empty"><div class="mark">📐</div><h2>Comece criando ou abrindo um desenho</h2><p>Crie o levantamento arquitetônico, insira aberturas e símbolos e exporte o resultado em DXF.</p><button class="primary" onclick="openDrawing(true)">Criar novo desenho</button></div>`}
function app(){return `<div class="app"><aside class="tools"><button class="tool ${tool==='select'?'active':''}" data-tool="select"><b>➤</b><small>Selecionar</small></button><button class="tool ${tool==='wall'?'active':''}" data-tool="wall"><b>▭</b><small>Parede</small></button><button class="tool ${tool==='door'?'active':''}" data-tool="door"><b>🚪</b><small>Porta</small></button><button class="tool ${tool==='window'?'active':''}" data-tool="window"><b>▱</b><small>Janela</small></button><div class="sep"></div><button class="tool ${grid?'active':''}" id="gridBtn"><b>▦</b><small>Grade</small></button><button class="tool ${snap?'active':''}" id="snapBtn"><b>🧲</b><small>Snap</small></button><div class="sep"></div><button class="tool" id="zin"><b>＋</b><small>Zoom</small></button><button class="tool" id="zout"><b>−</b><small>Zoom</small></button></aside><div class="center"><div class="bar"><button class="action" id="undo">↶ Desfazer</button><button class="action" id="redo">↷ Refazer</button><button class="action danger" id="clear">🗑 Limpar</button><button class="action" id="save">💾 JSON</button><button class="action" id="backup">📦 Backup</button><button class="action" id="dxf">📐 DXF</button><span class="zoom" id="zoom">Zoom: ${Math.round(zoom*100)}%</span></div><div class="stage ${grid?'grid':''}" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint">${hint()}</div></div></div><aside class="side">${side()}</aside></div>`}
function hint(){return tool==='wall'?'Arraste para indicar direção; depois informe comprimento e ângulo.':tool==='door'?'Clique sobre uma parede para inserir uma porta.':tool==='window'?'Clique sobre uma parede para inserir uma janela.':tool==='symbol'?'Clique na prancheta para inserir o símbolo.':'Clique em um elemento para selecionar e arraste para mover.'}
function side(){let p=items.find(x=>x.id===selected);return `<h2>Propriedades</h2><div class="block"><h3>Elemento selecionado</h3>${p?props(p):'<p style="font-size:11px;color:var(--muted)">Nenhum elemento selecionado.</p>'}</div><div class="block"><h3>Espessura da parede</h3><div class="row">${[.1,.15,.2].map(v=>`<button class="chip ${wallWidth===v?'active':''}" data-width="${v}">${v*100} cm</button>`).join('')}</div></div><div class="block"><h3>Arquitetura</h3><div class="library"><button class="symbol" data-tool="door"><b>🚪</b>Porta</button><button class="symbol" data-tool="window"><b>▱</b>Janela</button></div></div><div class="block"><h3>Incêndio</h3><div class="library">${[['extintor','🧯'],['hidrante','💧'],['alarme','🔔'],['iluminacao','💡'],['sinalizacao','↗'],['sprinkler','✣']].map(([n,i])=>`<button class="symbol" data-symbol="${n}" data-icon="${i}"><b>${i}</b>${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div></div><div class="block"><h3>Estado</h3><div class="status">${items.length} elemento(s)</div></div>`}
function props(p){return `<div class="field"><label>Identificação</label><input id="propLabel" value="${p.label||p.type}"></div><div class="field"><label>Camada</label><input id="propLayer" value="${p.layer||''}"></div>${p.type==='wall'?`<p style="font-size:11px">Comprimento: <b>${p.length.toFixed(2)} m</b><br>Ângulo: <b>${p.angle.toFixed(1)}°</b></p>`:''}<div class="side-actions"><button class="mini" id="duplicate">Duplicar</button><button class="mini" id="rotate">Girar 90°</button><button class="mini red" id="delete">Excluir</button></div>`}
function render(){let w=$('#workspace');w.classList.toggle('draw',view==='desenho');w.innerHTML=view==='visao'?overview():app();if(view==='desenho'){bind();resize();draw()}}
function openDrawing(clear=false){if(clear){snapshot();items=[];selected=null}view='desenho';$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view==='desenho'));render()}
$$('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));if(view==='importar'){$('#fileInput').click();view='desenho'}else if(view==='exportar'){view='desenho';render();exportDXF()}else if(view!=='visao')view='desenho';render()});
function bind(){$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;render()});$$('[data-symbol]').forEach(b=>b.onclick=()=>{tool='symbol';draft={name:b.dataset.symbol,icon:b.dataset.icon};render()});$$('[data-width]').forEach(b=>b.onclick=()=>{wallWidth=+b.dataset.width;render()});$('#gridBtn').onclick=()=>{grid=!grid;render()};$('#snapBtn').onclick=()=>{snap=!snap;render()};$('#zin').onclick=()=>{zoom=Math.min(4,zoom+.1);render()};$('#zout').onclick=()=>{zoom=Math.max(.3,zoom-.1);render()};$('#undo').onclick=undo;$('#redo').onclick=redo;$('#clear').onclick=()=>{if(items.length&&confirm('Limpar toda a prancheta?')){snapshot();items=[];selected=null;render()}};$('#save').onclick=saveJSON;$('#backup').onclick=backup;$('#dxf').onclick=exportDXF;let c=$('#canvas');c.onpointerdown=down;c.onpointermove=move;c.onpointerup=up;let p=items.find(x=>x.id===selected);if(p){$('#propLabel').onchange=e=>{snapshot();p.label=e.target.value;draw()};$('#propLayer').onchange=e=>{snapshot();p.layer=cleanLayer(e.target.value);draw()};$('#delete').onclick=()=>{snapshot();items=items.filter(x=>x.id!==p.id);selected=null;render()};$('#duplicate').onclick=()=>{snapshot();items.push({...p,id:uid(),x:(p.x||0)+30,y:(p.y||0)+30,x1:p.x1+30,y1:p.y1+30,x2:p.x2+30,y2:p.y2+30});render()};$('#rotate').onclick=()=>{snapshot();p.angle=((p.angle||0)+90)%360;render()}}}
function resize(){let c=$('#canvas'),r=c.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px'}addEventListener('resize',()=>{if(view==='desenho'){resize();draw()}});
function pos(e){let r=$('#canvas').getBoundingClientRect(),x=(e.clientX-r.left)/zoom,y=(e.clientY-r.top)/zoom;if(snap){x=Math.round(x/GRID)*GRID;y=Math.round(y/GRID)*GRID}return{x,y}}
let drag=null;function down(e){let p=pos(e);if(tool==='wall'){drag={mode:'wall',start:p,end:p};return}if(tool==='door'||tool==='window'){let wall=nearWall(p);if(!wall){toast('Clique mais próximo de uma parede.');return}openConfig(tool).then(v=>{if(!v)return;snapshot();let q=project(wall,p);items.push({id:uid(),type:tool,wallId:wall.id,x:q.x,y:q.y,angle:wall.angle,width:v.width,height:v.height,sill:v.sill||0,layer:tool==='door'?'ARQ_PORTAS':'ARQ_JANELAS',label:tool==='door'?'Porta':'Janela'});render()});return}if(tool==='symbol'&&draft){snapshot();items.push({id:uid(),type:'symbol',x:p.x,y:p.y,width:.5,height:.5,angle:0,label:draft.name,icon:draft.icon,layer:'INCENDIO'});selected=items.at(-1).id;tool='select';render();return}let hit=hitTest(p);selected=hit?.id||null;if(hit)drag={mode:'move',item:hit,start:p,original:{...hit}};render()}
function move(e){if(!drag)return;let p=pos(e);if(drag.mode==='wall'){drag.end=p;draw();previewWall(drag.start,p)}else{let dx=p.x-drag.start.x,dy=p.y-drag.start.y,o=drag.original,t=drag.item;if(t.type==='wall'){t.x1=o.x1+dx;t.y1=o.y1+dy;t.x2=o.x2+dx;t.y2=o.y2+dy}else{t.x=o.x+dx;t.y=o.y+dy}draw()}}
async function up(e){if(!drag)return;if(drag.mode==='wall'){let a=drag.start,b=drag.end;drag=null;let dx=b.x-a.x,dy=b.y-a.y,px=Math.hypot(dx,dy);if(px<5)return;let angle=Math.atan2(dy,dx)*180/Math.PI,vals=await openConfig('wall',{length:px/SCALE,angle});if(!vals)return;let len=vals.length*SCALE,rad=vals.angle*Math.PI/180;snapshot();items.push({id:uid(),type:'wall',x1:a.x,y1:a.y,x2:a.x+Math.cos(rad)*len,y2:a.y+Math.sin(rad)*len,length:vals.length,angle:vals.angle,width:wallWidth,layer:'ARQ_PAREDES',label:'Parede'});selected=items.at(-1).id;render()}else{snapshot(drag.original);drag=null;render()}}
function draw(){let c=$('#canvas');if(!c)return;let ctx=c.getContext('2d'),d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,c.width/d,c.height/d);ctx.save();ctx.scale(zoom,zoom);items.forEach(i=>drawItem(ctx,i,i.id===selected));ctx.restore()}
function drawItem(c,i,sel){c.save();c.strokeStyle=sel?'#f28c28':'#263b3b';c.fillStyle=sel?'#fff3df':'#315858';c.lineWidth=sel?3:2;if(i.type==='wall'){c.lineCap='butt';c.lineWidth=Math.max(4,i.width*SCALE);c.strokeStyle=sel?'#f28c28':'#263b3b';c.beginPath();c.moveTo(i.x1,i.y1);c.lineTo(i.x2,i.y2);c.stroke();c.lineWidth=1;c.fillStyle='#315858';c.font='11px Segoe UI';c.fillText(`${i.length.toFixed(2)} m`,(i.x1+i.x2)/2,(i.y1+i.y2)/2-8)}else if(i.type==='door'){c.translate(i.x,i.y);c.rotate(i.angle*Math.PI/180);c.beginPath();c.moveTo(0,0);c.lineTo(i.width*SCALE,0);c.stroke();c.beginPath();c.arc(0,0,i.width*SCALE,0,Math.PI/2);c.stroke()}else if(i.type==='window'){c.translate(i.x,i.y);c.rotate(i.angle*Math.PI/180);let w=i.width*SCALE;c.beginPath();c.moveTo(-w/2,-5);c.lineTo(w/2,-5);c.moveTo(-w/2,0);c.lineTo(w/2,0);c.moveTo(-w/2,5);c.lineTo(w/2,5);c.stroke()}else{c.translate(i.x,i.y);c.rotate((i.angle||0)*Math.PI/180);c.font='28px Segoe UI';c.textAlign='center';c.textBaseline='middle';c.fillText(i.icon||'◆',0,0);c.font='10px Segoe UI';c.fillStyle='#263b3b';c.fillText(i.label,0,25)}c.restore()}
function previewWall(a,b){let c=$('#canvas'),ctx=c.getContext('2d'),d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.save();ctx.scale(zoom,zoom);ctx.strokeStyle='#f28c28';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function hitTest(p){for(let i=items.length-1;i>=0;i--){let x=items[i];if(x.type==='wall'&&distanceSegment(p,x)<12)return x;if(x.type!=='wall'&&Math.hypot(p.x-x.x,p.y-x.y)<25)return x}return null}function nearWall(p){return items.filter(x=>x.type==='wall').sort((a,b)=>distanceSegment(p,a)-distanceSegment(p,b))[0]&&distanceSegment(p,items.filter(x=>x.type==='wall').sort((a,b)=>distanceSegment(p,a)-distanceSegment(p,b))[0])<25?items.filter(x=>x.type==='wall').sort((a,b)=>distanceSegment(p,a)-distanceSegment(p,b))[0]:null}function project(w,p){let dx=w.x2-w.x1,dy=w.y2-w.y1,t=((p.x-w.x1)*dx+(p.y-w.y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return{x:w.x1+t*dx,y:w.y1+t*dy}}
function distanceSegment(p,w){let q=project(w,p);return Math.hypot(p.x-q.x,p.y-q.y)}function snapshot(){history.push(JSON.stringify(items));if(history.length>80)history.shift();future=[]}function undo(){if(!history.length)return;future.push(JSON.stringify(items));items=JSON.parse(history.pop());selected=null;render()}function redo(){if(!future.length)return;history.push(JSON.stringify(items));items=JSON.parse(future.pop());selected=null;render()}
function openConfig(type,def={}){return new Promise(resolve=>{modalResolve=resolve;$('#modalTitle').textContent=type==='wall'?'Inserir parede':type==='door'?'Inserir porta':'Inserir janela';$('#modalFields').innerHTML=type==='wall'?field('length','Comprimento (m)',round(def.length||3),'.01')+field('angle','Ângulo (°)',round(def.angle||0),'.1'):field('width','Largura (m)',type==='door'?'.90':'1.20','.05')+field('height','Altura (m)',type==='door'?'2.10':'1.00','.05')+(type==='window'?field('sill','Peitoril (m)','.90','.05'):'');$('#modal').classList.remove('hidden');setTimeout(()=>$('#modal input')?.select(),0)})}function field(id,label,val,step){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="number" step="${step}" value="${val}" required></div>`}
$('#modalCancel').onclick=()=>closeModal(null);$('#modalForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));Object.keys(data).forEach(k=>data[k]=+data[k]);closeModal(data)};function closeModal(v){$('#modal').classList.add('hidden');let r=modalResolve;modalResolve=null;r?.(v)}
function cleanLayer(s){return (s||'0').toUpperCase().replace(/[^A-Z0-9_-]/g,'_').slice(0,40)}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function projectData(){return JSON.stringify({version:1,unit:'meters',scale:SCALE,exported_at:new Date().toISOString(),items},null,2)}function saveJSON(){download(`prancheta_${stamp()}.json`,projectData(),'application/json');$('#projectState').textContent='Projeto exportado'}function backup(){download(`backup_prancheta_${stamp()}.json`,projectData(),'application/json');toast('Backup JSON gerado. O DXF pode ser exportado no botão ao lado.')}function stamp(){return new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')}
$('#fileInput').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.items))throw 0;snapshot();items=data.items;selected=null;openDrawing();toast('Projeto importado com sucesso.')}catch{toast('Arquivo de projeto inválido.')}e.target.value=''};
function exportDXF(){let layers=[...new Set(items.map(i=>cleanLayer(i.layer)))],ent='';for(let i of items){let L=cleanLayer(i.layer),mx=x=>x/SCALE,my=y=>-y/SCALE;if(i.type==='wall')ent+=line(mx(i.x1),my(i.y1),mx(i.x2),my(i.y2),L);else if(i.type==='door'){let r=i.angle*Math.PI/180,w=i.width;ent+=line(mx(i.x),my(i.y),mx(i.x)+Math.cos(r)*w,my(i.y)-Math.sin(r)*w,L)}else if(i.type==='window'){let r=i.angle*Math.PI/180,w=i.width/2,cx=mx(i.x),cy=my(i.y),dx=Math.cos(r)*w,dy=-Math.sin(r)*w;ent+=line(cx-dx,cy-dy,cx+dx,cy+dy,L)}else ent+=text(mx(i.x),my(i.y),i.label||'SIMBOLO',L)}let tabs=layers.map((l,n)=>`0\nLAYER\n2\n${l}\n70\n0\n62\n${(n%7)+1}\n6\nCONTINUOUS\n`).join('');let d=`0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n9\n$INSUNITS\n70\n6\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n${layers.length}\n${tabs}0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n${ent}0\nENDSEC\n0\nEOF\n`;download(`prancheta_${stamp()}.dxf`,d,'application/dxf');toast('DXF exportado em metros.')}function line(x1,y1,x2,y2,l){return `0\nLINE\n8\n${l}\n10\n${x1}\n20\n${y1}\n30\n0\n11\n${x2}\n21\n${y2}\n31\n0\n`}function text(x,y,t,l){return `0\nTEXT\n8\n${l}\n10\n${x}\n20\n${y}\n30\n0\n40\n0.12\n1\n${String(t).replace(/[^\x20-\x7EÀ-ÿ]/g,'')}\n`}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3000)}render();
</script></body></html>
