<section class="sar-tabela-tecnica">

  <div class="sar-abas-tecnicas">
    <button class="sar-aba-tecnica ativa" data-material="Aço">
      Perda localizada - Aço
    </button>

    <button class="sar-aba-tecnica" data-material="PVC / PEAD">
      Perda localizada - PVC
    </button>
  </div>

  <section class="sar-consulta">
    <h3>Consulta</h3>

    <div class="sar-filtros">
      <div>
        <label>Pesquisar</label>
        <input id="plPesquisa" type="search" placeholder="Ex.: curva, tê, registro...">
      </div>

      <div>
        <label>Categoria</label>
        <select id="plFiltroCategoria">
          <option value="">Todas</option>
        </select>
      </div>

      <div>
        <label>DN</label>
        <select id="plFiltroDn">
          <option value="">Todos</option>
        </select>
      </div>

      <button id="plLimpar">Limpar</button>
    </div>

    <div class="sar-contadores">
      <span id="plExibidos">Registros exibidos: 0</span>
      <span id="plTotal">Total no banco: 0</span>
    </div>
  </section>

  <section class="sar-tabela-wrap">
    <table class="sar-tabela">
      <thead>
        <tr>
          <th>Material</th>
          <th>Categoria</th>
          <th>Conexão / Peça</th>
          <th>DN<br>(mm)</th>
          <th>Comprimento<br>equivalente (m)</th>
        </tr>
      </thead>

      <tbody id="plTabelaCorpo">
        <tr>
          <td colspan="5">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </section>

</section>

<style>
  .sar-tabela-tecnica {
    width: 100%;
    padding: 18px;
    background: #f7fafa;
    color: #173333;
    font-family: Arial, Helvetica, sans-serif;
  }

  .sar-abas-tecnicas {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    padding: 10px;
    border: 1px solid #d7dfdf;
    border-radius: 10px;
    background: #ffffff;
  }

  .sar-aba-tecnica {
    padding: 12px 18px;
    border: 0;
    border-radius: 7px;
    background: #dfe8e8;
    color: #214646;
    font-weight: 700;
    cursor: pointer;
  }

  .sar-aba-tecnica.ativa {
    background: #2f5b5b;
    color: #ffffff;
  }

  .sar-consulta {
    margin-bottom: 16px;
    padding: 18px;
    border: 1px solid #d7dfdf;
    border-radius: 10px;
    background: #ffffff;
  }

  .sar-consulta h3 {
    margin: 0 0 14px;
    color: #1d4747;
  }

  .sar-filtros {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1fr auto;
    gap: 12px;
    align-items: end;
  }

  .sar-filtros label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
  }

  .sar-filtros input,
  .sar-filtros select {
    width: 100%;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid #c7d3d3;
    border-radius: 7px;
    background: #ffffff;
    color: #173333;
  }

  .sar-filtros button {
    min-height: 42px;
    padding: 9px 18px;
    border: 1px solid #2f5b5b;
    border-radius: 7px;
    background: #ffffff;
    color: #2f5b5b;
    font-weight: 700;
    cursor: pointer;
  }

  .sar-contadores {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .sar-contadores span {
    padding: 8px 13px;
    border: 1px solid #c7dada;
    border-radius: 20px;
    background: #eef7f7;
    color: #174747;
    font-size: 13px;
    font-weight: 700;
  }

  .sar-tabela-wrap {
    overflow-x: auto;
    border: 1px solid #d7dfdf;
    border-radius: 10px;
    background: #ffffff;
  }

  .sar-tabela {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
  }

  .sar-tabela th {
    padding: 13px 10px;
    background: #2f5b5b;
    color: #ffffff;
    font-size: 12px;
    text-align: center;
    text-transform: uppercase;
    border-right: 1px solid #d8e3e3;
  }

  .sar-tabela td {
    padding: 12px 10px;
    border-bottom: 1px solid #dfe7e7;
    border-right: 1px solid #edf1f1;
    font-size: 14px;
    text-align: center;
  }

  .sar-tabela td:nth-child(2),
  .sar-tabela td:nth-child(3) {
    text-align: left;
  }

  .sar-tabela tbody tr:hover {
    background: #f1f7f7;
  }

  @media (max-width: 800px) {
    .sar-filtros {
      grid-template-columns: 1fr;
    }

    .sar-abas-tecnicas {
      flex-direction: column;
    }
  }
</style>

<script>
  const PL_VIEW = "vw_hidraulica_comprimentos_equivalentes";

  let plMaterialAtual = "Aço";
  let plDados = [];

  const plPesquisa = document.getElementById("plPesquisa");
  const plFiltroCategoria = document.getElementById("plFiltroCategoria");
  const plFiltroDn = document.getElementById("plFiltroDn");
  const plTabelaCorpo = document.getElementById("plTabelaCorpo");
  const plExibidos = document.getElementById("plExibidos");
  const plTotal = document.getElementById("plTotal");
  const plLimpar = document.getElementById("plLimpar");

  function plFormatarNumero(valor, casas = 2) {
    return Number(valor || 0).toLocaleString("pt-BR", {
      minimumFractionDigits: casas,
      maximumFractionDigits: casas
    });
  }

  function plNormalizar(texto) {
    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }

  async function plCarregarDados() {
    plTabelaCorpo.innerHTML = `
      <tr>
        <td colspan="5">Carregando...</td>
      </tr>
    `;

    const PL_VIEW = "vw_hidraulica_comprimentos_equivalentes";

    if (!cliente) {
      plTabelaCorpo.innerHTML = `
        <tr>
          <td colspan="5">Supabase não encontrado na página.</td>
        </tr>
      `;
      return;
    }

    const { data, error } = await cliente
      .from(PL_VIEW)
      .select("*")
      .eq("ativo", true)
      .eq("material", plMaterialAtual)
      .order("ordem", { ascending: true })
      .order("dn_mm", { ascending: true });

    if (error) {
      console.error(error);
      plTabelaCorpo.innerHTML = `
        <tr>
          <td colspan="5">Erro ao carregar dados do Supabase.</td>
        </tr>
      `;
      return;
    }

    plDados = data || [];

    plPreencherFiltros();
    plRenderizar();
  }

  function plPreencherFiltros() {
    const categoriaAtual = plFiltroCategoria.value;
    const dnAtual = plFiltroDn.value;

    const categorias = [...new Set(plDados.map(i => i.categoria).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, "pt-BR"));

    const dns = [...new Set(plDados.map(i => i.dn_mm).filter(Boolean))]
      .sort((a, b) => Number(a) - Number(b));

    plFiltroCategoria.innerHTML = `<option value="">Todas</option>`;
    categorias.forEach(categoria => {
      plFiltroCategoria.innerHTML += `
        <option value="${categoria}">${categoria}</option>
      `;
    });

    plFiltroDn.innerHTML = `<option value="">Todos</option>`;
    dns.forEach(dn => {
      plFiltroDn.innerHTML += `
        <option value="${dn}">${dn} mm</option>
      `;
    });

    if (categorias.includes(categoriaAtual)) {
      plFiltroCategoria.value = categoriaAtual;
    }

    if (dns.map(String).includes(String(dnAtual))) {
      plFiltroDn.value = dnAtual;
    }
  }

  function plFiltrarDados() {
    const pesquisa = plNormalizar(plPesquisa.value);
    const categoria = plFiltroCategoria.value;
    const dn = plFiltroDn.value;

    return plDados.filter(item => {
      const texto = plNormalizar([
        item.material,
        item.categoria,
        item.conexao,
        item.dn_mm,
        item.comprimento_equivalente_m
      ].join(" "));

      const atendePesquisa = !pesquisa || texto.includes(pesquisa);
      const atendeCategoria = !categoria || item.categoria === categoria;
      const atendeDn = !dn || String(item.dn_mm) === String(dn);

      return atendePesquisa && atendeCategoria && atendeDn;
    });
  }

  function plRenderizar() {
    const registros = plFiltrarDados();

    plExibidos.textContent = `Registros exibidos: ${registros.length}`;
    plTotal.textContent = `Total no banco: ${plDados.length}`;

    if (registros.length === 0) {
      plTabelaCorpo.innerHTML = `
        <tr>
          <td colspan="5">Nenhum registro encontrado.</td>
        </tr>
      `;
      return;
    }

    plTabelaCorpo.innerHTML = registros.map(item => `
      <tr>
        <td>${item.material || ""}</td>
        <td>${item.categoria || ""}</td>
        <td>${item.conexao || ""}</td>
        <td><strong>${item.dn_mm || ""}</strong></td>
        <td><strong>${plFormatarNumero(item.comprimento_equivalente_m)} m</strong></td>
      </tr>
    `).join("");
  }

  document.querySelectorAll(".sar-aba-tecnica").forEach(botao => {
    botao.addEventListener("click", () => {
      document.querySelectorAll(".sar-aba-tecnica").forEach(b => {
        b.classList.remove("ativa");
      });

      botao.classList.add("ativa");

      plMaterialAtual = botao.dataset.material;

      plPesquisa.value = "";
      plFiltroCategoria.value = "";
      plFiltroDn.value = "";

      plCarregarDados();
    });
  });

  plPesquisa.addEventListener("input", plRenderizar);
  plFiltroCategoria.addEventListener("change", plRenderizar);
  plFiltroDn.addEventListener("change", plRenderizar);

  plLimpar.addEventListener("click", () => {
    plPesquisa.value = "";
    plFiltroCategoria.value = "";
    plFiltroDn.value = "";
    plRenderizar();
  });

  plCarregarDados();
</script>
