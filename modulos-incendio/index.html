<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Central de módulos independentes | SAR Engenharia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--verde:#0c3b2e;--verde2:#12834c;--verde3:#19a35b;--fundo:#f4f7f5;--texto:#234e52;--muted:#66736d;--borda:#dce5e0;--branco:#fff;--erro:#a72e2e;--destaque:#75a92d;--sar:#315858}
    *{box-sizing:border-box} body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:100%;margin:0;padding:18px 20px 70px}
    .cabecalho-pagina{display:block;width:100%;margin:0 0 14px;padding:0;text-align:left}
    .titulo-pagina{display:block;margin:0;color:var(--sar);font-family:"Segoe UI",Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.2;text-align:left}
    #estado{padding:22px;border:1px solid var(--borda);border-radius:15px;background:#fff;color:var(--muted)}
    #estado.erro{border-color:#e8bcbc;background:#fff7f7;color:var(--erro)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,300px);gap:14px;justify-content:start;align-items:start}
    .card{position:relative;width:300px;height:142px;background:#fff;border:1px solid var(--borda);border-left:6px solid #a7b2ad;border-radius:12px;padding:15px 16px 13px;box-shadow:0 4px 14px #1232260a;overflow:hidden;display:flex;flex-direction:column;transition:.2s ease}
    .card.abrivel{border-left-color:var(--verde3);background:linear-gradient(105deg,#f1fff7 0,#fff 43%)}
    .card.abrivel:hover{transform:translateY(-3px);box-shadow:0 13px 32px #13754320;border-color:#91d7ae;border-left-color:var(--verde3)}
    .topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .icone{font-size:27px;line-height:1}.selo{flex:none;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;letter-spacing:.07em;background:#eef1ef;color:#65716b}
    .abrivel .selo{background:var(--verde3);color:#fff;box-shadow:0 5px 14px #19a35b38}
    .card h2{color:var(--verde);font-size:16px;line-height:1.15;margin:8px 0 4px}.card p{color:var(--muted);font-size:10.5px;line-height:1.28;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.versao{font-size:9.5px;color:#7c8882;font-weight:700}
    .acao{border:0;border-radius:7px;padding:6px 9px;font:inherit;font-size:10px;font-weight:800;background:#e9eeeb;color:#6d7872;text-decoration:none;pointer-events:none}
    .abrivel .acao{background:var(--verde2);color:#fff;pointer-events:auto}.abrivel .acao:hover{background:#0e713f}
    @media(max-width:600px){main{padding:18px 14px 50px}.titulo-pagina{font-size:23px}.grid{grid-template-columns:minmax(0,300px)}.card{width:min(300px,100%)}.acao{text-align:center}}
  </style>
</head>
<body>
  <main>
    <header class="cabecalho-pagina" data-revisao="titulo-padrao-sar-v3">
      <h1 class="titulo-pagina">Central de Módulos Independentes</h1>
    </header>
    <div id="estado">Carregando módulos disponíveis…</div>
    <section id="cards" class="grid" hidden aria-live="polite"></section>
  </main>
  <script>
    const SUPABASE_URL = 'https://bjtxbpmrmhfvpmdsthxr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_E1Oxs2VdHcNrVbb7yIGnsg_zd6EYMvM';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const estado = document.querySelector('#estado');
    const cards = document.querySelector('#cards');
    const texto = (valor, padrao = '') => valor == null || valor === '' ? padrao : String(valor);

    function criarCard(item) {
      const abrivel = item.pode_abrir === true;
      const article = document.createElement('article');
      article.className = `card${abrivel ? ' abrivel' : ''}`;

      const topo = document.createElement('div'); topo.className = 'topo';
      const icone = document.createElement('span'); icone.className = 'icone'; icone.textContent = texto(item.icone, '🧯');
      const selo = document.createElement('span'); selo.className = 'selo'; selo.textContent = texto(item.selo, abrivel ? 'DISPONÍVEL' : 'EM BREVE');
      topo.append(icone, selo);

      const titulo = document.createElement('h2'); titulo.textContent = texto(item.titulo, 'Módulo SAR');
      const descricao = document.createElement('p'); descricao.textContent = texto(item.descricao, 'Ferramenta técnica do SAR Engenharia.');
      const rodape = document.createElement('div'); rodape.className = 'rodape';
      const versao = document.createElement('span'); versao.className = 'versao'; versao.textContent = item.versao ? `Versão ${item.versao}` : '';
      const acao = document.createElement('a'); acao.className = 'acao'; acao.textContent = texto(item.texto_botao, abrivel ? 'Acessar módulo' : 'Em breve');
      acao.href = abrivel ? texto(item.rota, '#') : '#';
      if (!abrivel) acao.setAttribute('aria-disabled', 'true');
      rodape.append(versao, acao); article.append(topo, titulo, descricao, rodape);
      return article;
    }

    async function carregar() {
      try {
        const { data, error } = await db.from('vw_sar_modulos_incendio_catalogo').select('*').order('ordem_menu', { ascending: true });
        if (error) throw error;
        if (!data?.length) {
          estado.textContent = 'Nenhum módulo está publicado nesta central no momento.';
          return;
        }
        cards.replaceChildren(...data.map(criarCard));
        estado.hidden = true; cards.hidden = false;
      } catch (erro) {
        console.error('Falha ao carregar catálogo:', erro);
        estado.className = 'erro';
        estado.textContent = `Não foi possível carregar os módulos. ${erro?.message || 'Verifique a conexão e tente novamente.'}`;
      }
    }
    carregar();
  </script>
</body>
</html>
