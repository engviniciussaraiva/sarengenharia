<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Central de módulos independentes | SAR Engenharia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--verde:#0c3b2e;--verde2:#12834c;--verde3:#19a35b;--fundo:#f4f7f5;--texto:#234e52;--muted:#66736d;--borda:#dce5e0;--branco:#fff;--erro:#a72e2e;--destaque:#75a92d;--sar:#315858}
    *{box-sizing:border-box} body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:100%;margin:0;padding:18px 20px 70px}
    .cabecalho-pagina{display:block;width:100%;margin:0 0 14px;padding:0;text-align:left}
    .titulo-pagina{display:block;margin:0;color:var(--sar);font-family:"Segoe UI",Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.2;text-align:left}
    #estado{padding:22px;border:1px solid var(--borda);border-radius:15px;background:#fff;color:var(--muted)}
    #estado.erro{border-color:#e8bcbc;background:#fff7f7;color:var(--erro)}
    .sar-mi-grid{display:grid;grid-template-columns:repeat(auto-fill,275px);gap:14px;justify-content:start;align-items:start}
    .sar-mi-card{position:relative;width:275px;height:134px;background:#fff;border:1px solid var(--borda);border-left:5px solid #a7b2ad;border-radius:8px;padding:15px 13px 13px 15px;box-shadow:0 3px 10px #12322608;overflow:hidden;display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:14px;color:inherit;text-decoration:none;transition:.2s ease}
    .sar-mi-card.sar-mi-abrivel{border-left-color:var(--verde3);background:linear-gradient(105deg,#f1fff7 0,#fff 43%)}
    .sar-mi-card.sar-mi-abrivel:hover{transform:translateY(-3px);box-shadow:0 13px 32px #13754320;border-color:#91d7ae;border-left-color:var(--verde3)}
    .sar-mi-topo{display:contents}
    .sar-mi-icone{grid-column:1;grid-row:1 / span 2;width:48px;height:48px;border-radius:9px;background:#edf6ef;display:grid;place-items:center;font-size:28px;line-height:1;margin-top:20px}
    .sar-mi-selo{position:absolute;top:12px;right:12px;display:inline-block;width:auto;height:auto;transform:none;writing-mode:horizontal-tb;border:0;border-radius:999px;padding:5px 9px;font-size:9px;line-height:1.2;font-weight:900;letter-spacing:.05em;background:#eef1ef;color:#65716b}
    .sar-mi-abrivel .sar-mi-selo{background:var(--verde3);color:#fff;box-shadow:0 5px 14px #19a35b38}
    .sar-mi-card h2{grid-column:2;grid-row:1;color:var(--verde);font-size:16px;line-height:1.15;margin:10px 72px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sar-mi-card p{grid-column:2;grid-row:2;color:var(--muted);font-size:11.5px;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .sar-mi-card.sar-mi-abrivel{cursor:pointer}
    .sar-mi-card.sar-mi-abrivel:focus-visible{outline:3px solid #7cc99c;outline-offset:3px}
    @media(max-width:600px){main{padding:18px 18px 50px}.titulo-pagina{font-size:26px}.sar-mi-grid{grid-template-columns:minmax(0,275px)}.sar-mi-card{width:min(275px,100%)}}
  </style>
</head>
<body>
  <main>
    <header class="cabecalho-pagina" data-revisao="titulo-padrao-sar-v3">
      <h1 class="titulo-pagina">Central de Módulos Independentes</h1>
    </header>
    <div id="estado">Carregando módulos disponíveis…</div>
    <section id="cards" class="sar-mi-grid" hidden aria-live="polite"></section>
  </main>
  <script>
    const SUPABASE_URL = 'https://bjtxbpmrmhfvpmdsthxr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_E1Oxs2VdHcNrVbb7yIGnsg_zd6EYMvM';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const estado = document.querySelector('#estado');
    const cards = document.querySelector('#cards');
    const texto = (valor, padrao = '') => valor == null || valor === '' ? padrao : String(valor);

    function criarCard(item) {
      const abrivel = item.pode_abrir === true;
      const article = document.createElement(abrivel ? 'a' : 'article');
      article.className = `sar-mi-card${abrivel ? ' sar-mi-abrivel' : ''}`;
      if (abrivel) article.href = texto(item.rota, '#');

      const topo = document.createElement('div'); topo.className = 'sar-mi-topo';
      const icone = document.createElement('span'); icone.className = 'sar-mi-icone'; icone.textContent = texto(item.icone, '🧯');
      const selo = document.createElement('span'); selo.className = 'sar-mi-selo'; selo.textContent = texto(item.selo, abrivel ? 'DISPONÍVEL' : 'EM BREVE');
      topo.append(icone, selo);

      const titulo = document.createElement('h2'); titulo.textContent = texto(item.titulo, 'Módulo SAR');
      const descricao = document.createElement('p'); descricao.textContent = texto(item.descricao, 'Ferramenta técnica do SAR Engenharia.');
      article.append(topo, titulo, descricao);
      return article;
    }

    async function carregar() {
      try {
        const { data, error } = await db.from('vw_sar_modulos_incendio_catalogo').select('*').order('ordem_menu', { ascending: true });
        if (error) throw error;
        if (!data?.length) {
          estado.textContent = 'Nenhum módulo está publicado nesta central no momento.';
          return;
        }
        cards.replaceChildren(...data.map(criarCard));
        estado.hidden = true; cards.hidden = false;
      } catch (erro) {
        console.error('Falha ao carregar catálogo:', erro);
        estado.className = 'erro';
        estado.textContent = `Não foi possível carregar os módulos. ${erro?.message || 'Verifique a conexão e tente novamente.'}`;
      }
    }
    carregar();
  </script>
</body>
</html>
